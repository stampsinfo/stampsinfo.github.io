<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sách lật trang PDF</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #2f3542;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        #loading {
            color: #ffffff; font-size: 18px; font-weight: bold;
            text-align: center; margin: 20px;
        }
        .flip-book-container {
            display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 20px auto;
        }
        .page {
            background-color: white; display: flex;
            justify-content: center; align-items: center;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; }
        .controls { display: none; gap: 15px; margin-top: 15px; z-index: 100; }
        button {
            padding: 10px 20px; font-size: 15px; font-weight: bold;
            cursor: pointer; border: none; background-color: #70a1ff;
            color: white; border-radius: 6px; transition: background 0.2s;
        }
        button:hover { background-color: #1e90ff; }
    </style>
</head>
<body>

    <div id="loading">Đang tải tài liệu PDF...</div>
    <div id="book" class="flip-book-container"></div>

    <div class="controls" id="controls">
        <button id="prevBtn">« Trang trước</button>
        <button id="nextBtn">Trang sau »</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // =========================================================
        // ĐẶT TÊN FILE PDF CỦA BẠN VÀO ĐÂY (CÙNG THƯ MỤC VỚI INDEX.HTML)
        const PDF_FILE_PATH = './vietminh.pdf'; 
        // =========================================================

        const bookElement = document.getElementById('book');
        const loadingElement = document.getElementById('loading');
        const controlsElement = document.getElementById('controls');

        async function initBook() {
            try {
                const pdf = await pdfjsLib.getDocument(PDF_FILE_PATH).promise;
                
                const page1 = await pdf.getPage(1);
                const viewport1 = page1.getViewport({ scale: 1.5 });
                const width = viewport1.width;
                const height = viewport1.height;

                for (let num = 1; num <= pdf.numPages; num++) {
                    const page = await pdf.getPage(num);
                    const viewport = page.getViewport({ scale: 1.5 });

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    pageDiv.appendChild(canvas);
                    bookElement.appendChild(pageDiv);
                }

                loadingElement.style.display = 'none';
                bookElement.style.display = 'block';
                controlsElement.style.display = 'flex';

                const pageFlip = new St.PageFlip(bookElement, {
                    width: width / 2,
                    height: height,
                    size: "stretch",
                    minWidth: 300, maxWidth: 1000,
                    minHeight: 400, maxHeight: 1400,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());

            } catch (error) {
                loadingElement.innerHTML = `<span style="color:#ff6b6b">Lỗi: Không tìm thấy file "${PDF_FILE_PATH}" trong GitHub Repository!</span>`;
                console.error(error);
            }
        }

        initBook();
    </script>
</body>
</html>
