<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Tem Thông Minh (Nhận Diện Ảnh dHash)</title>
    <!-- Nhúng sẵn file database.js vào trang -->
    <script src="database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: #0f172a; color: #fff; margin: 0; }
        .box { background: #1e293b; max-width: 800px; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        .drop-zone { border: 2px dashed #475569; padding: 30px; border-radius: 8px; background: #334155; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
        .drop-zone:hover { border-color: #38bdf8; background: #334155aa; }
        input[type="file"] { display: none; }
        
        #previewImg { max-width: 200px; max-height: 200px; border-radius: 6px; margin-top: 15px; display: none; border: 2px solid #64748b; }
        
        #resultBox { margin-top: 25px; background: #020617; padding: 20px; border-radius: 8px; text-align: left; border: 1px solid #334155; display: none; }
        #resultBox h3 { color: #4ade80; margin-top: 0; margin-bottom: 10px; }
        #resultBox p { color: #cbd5e1; margin: 8px 0; }
        #resultBox a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        #resultBox a:hover { text-decoration: underline; }
        
        .loading { color: #f59e0b; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>🔍 TRA CỨU TEM THÔNG MINH QUA ẢNH</h2>
    <p>Tải ảnh con tem lên hoặc kéo thả vào đây để tìm bài viết tương ứng trong Database.</p>
    
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
        <span style="font-size: 30px;">📁</span><br>
        <b>Click để chọn ảnh</b> hoặc kéo thả ảnh vào đây
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
    </div>

    <div>
        <img id="previewImg" alt="Ảnh xem trước">
    </div>

    <div id="loadingText" class="loading">⏳ Đang xử lý và phân tích mã băm ảnh...</div>

    <div id="resultBox">
        <h3 id="resTitle">Kết quả tìm kiếm</h3>
        <p><b>Bài viết:</b> <a id="resLink" href="#" target="_blank">Xem bài viết</a></p>
        <p><b>Link ảnh gốc:</b> <span id="resImgUrl" style="word-break: break-all; color: #94a3b8; font-size: 12px;"></span></p>
        <p><b>Độ chính xác (Sai số Hamming):</b> <span id="resScore" style="color: #f59e0b;"></span></p>
    </div>
</div>

<script>
    // --- 1. XỬ LÝ KHI NGƯỜI DÙNG CHỌN / KÉO THẢ ẢNH ---
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) processImageFile(file);
    }

    function handleDrop(event) {
        event.preventDefault();
        const file = event.dataTransfer.files[0];
        if (file) processImageFile(file);
    }

    function processImageFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                // Hiển thị ảnh xem trước
                const preview = document.getElementById('previewImg');
                preview.src = e.target.result;
                preview.style.display = 'inline-block';

                // Ẩn kết quả cũ, hiện thông báo đang xử lý
                document.getElementById('resultBox').style.display = 'none';
                document.getElementById('loadingText').style.display = 'block';

                // Chạy thuật toán băm ảnh ngay lập tức
                setTimeout(() => {
                    try {
                        let inputHash = computeDHash256(img);
                        searchDatabase(inputHash);
                    } catch (err) {
                        alert("Lỗi xử lý ảnh: " + err.message);
                        document.getElementById('loadingText').style.display = 'none';
                    }
                }, 50);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // --- 2. THUẬT TOÁN dHash 256-bit (Chuẩn tỷ lệ 17x16 giống hệt trang quét) ---
    function computeDHash256(imgElement) {
        const canvas = document.createElement('canvas');
        canvas.width = 17; 
        canvas.height = 16;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, 17, 16);

        const scale = Math.min(17 / imgElement.width, 16 / imgElement.height);
        const w = imgElement.width * scale;
        const h = imgElement.height * scale;
        const x = (17 - w) / 2;
        const y = (16 - h) / 2;
        
        ctx.drawImage(imgElement, x, y, w, h);
        
        const imgData = ctx.getImageData(0, 0, 17, 16).data;
        let grayscale = [];
        for (let i = 0; i < imgData.length; i += 4) {
            let r = imgData[i], g = imgData[i+1], b = imgData[i+2], a = imgData[i+3] / 255;
            grayscale.push((r * 0.299 + g * 0.587 + b * 0.114) * a + 255 * (1 - a));
        }

        let hash = "";
        for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
                hash += (grayscale[y * 17 + x] > grayscale[y * 17 + x + 1]) ? "1" : "0";
            }
        }
        return hash;
    }

    // --- 3. HÀM TÍNH KHOẢNG CÁCH HAMMING ---
    function hammingDistance(hash1, hash2) {
        let dist = 0;
        for (let i = 0; i < hash1.length; i++) {
            if (hash1[i] !== hash2[i]) dist++;
        }
        return dist;
    }

function searchDatabase(inputHash) {
        document.getElementById('loadingText').style.display = 'none';

        if (typeof blogDatabase === 'undefined' || !Array.isArray(blogDatabase) || blogDatabase.length === 0) {
            alert("Không tìm thấy dữ liệu trong file database.js!");
            return;
        }

        let results = [];

        // Tính toán khoảng cách Hamming cho TOÀN BỘ database
        for (let item of blogDatabase) {
            let cost = hammingDistance(inputHash, item.h);
            results.push({ item: item, cost: cost });
        }

        // Sắp xếp từ độ sai số thấp nhất đến cao nhất (càng thấp càng giống)
        results.sort((a, b) => a.cost - b.cost);

        // Lấy top 5 kết quả tốt nhất để phân tích
        let topResults = results.slice(0, 5);

        let resultBox = document.getElementById('resultBox');
        let htmlContent = `<h3>🔍 Top 5 kết quả gần nhất:</h3>`;
        
        topResults.forEach((res, index) => {
            let color = res.cost <= 45 ? "#4ade80" : (res.cost <= 75 ? "#f59e0b" : "#ef4444");
            htmlContent += `
                <div style="border-bottom: 1px dashed #334155; padding: 10px 0;">
                    <p style="margin: 0; color: #fff;"><b>#${index + 1}. Bài viết:</b> <a href="${res.item.u}" target="_blank" style="color: #38bdf8;">${res.item.t}</a></p>
                    <p style="margin: 4px 0 0 0; font-size: 13px; color: ${color};">Sai số Hamming: <b>${res.cost} bits</b></p>
                    <p style="margin: 2px 0 0 0; font-size: 11px; color: #94a3b8; word-break: break-all;">Ảnh: ${res.item.img}</p>
                </div>
            `;
        });

        resultBox.innerHTML = htmlContent;
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>
