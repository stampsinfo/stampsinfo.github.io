<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Kiếm Tem Bằng Hình Ảnh</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #2c3e50; margin-top: 0; }
        
        /* Khu vực upload ảnh */
        .upload-area { border: 2px dashed #3498db; padding: 30px; border-radius: 8px; background: #ebf5fb; cursor: pointer; transition: 0.3s; position: relative; margin-bottom: 20px; }
        .upload-area:hover { background: #d6eaf8; border-color: #2980b9; }
        .upload-area p { margin: 0; font-size: 16px; color: #2980b9; font-weight: bold; }
        #fileInput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        /* Hiển thị ảnh tải lên */
        #preview { max-width: 250px; max-height: 250px; display: none; margin: 15px auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        
        /* Nút tìm kiếm */
        button { background: #e74c3c; color: #fff; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #c0392b; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        
        /* Kết quả */
        #status { margin-top: 15px; font-weight: bold; color: #7f8c8d; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .result-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.3s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .result-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .result-img { width: 100%; height: 180px; object-fit: contain; background: #fafafa; border-bottom: 1px solid #eee; padding: 5px; box-sizing: border-box; }
        .result-info { padding: 15px; text-align: left; }
        .result-title { font-size: 14px; font-weight: bold; margin: 0 0 10px 0; color: #2c3e50; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .result-sim { font-size: 13px; color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Tìm Kiếm Hình Ảnh</h1>
    
    <div class="upload-area">
        <p>Nhấp vào đây, kéo thả ảnh hoặc dán (Ctrl+V) ảnh vào đây</p>
        <input type="file" id="fileInput" accept="image/*">
    </div>
    
    <img id="preview" alt="Ảnh tải lên">
    <br>
    <button id="searchBtn" onclick="processSearch()" disabled>Tìm Kiếm Ngay</button>
    
    <div id="status">Vui lòng tải file database.js trước khi tìm kiếm...</div>
    
    <div class="results-grid" id="results"></div>
</div>

<!-- Nạp Database đã quét -->
<script src="database.js"></script>

<script>
    let uploadedImage = null;
    const SIMILARITY_THRESHOLD = 75; // Độ trùng khớp tối thiểu (75%)

    // Kiểm tra xem database.js đã được tải chưa
    window.onload = function() {
        if (typeof blogDatabase !== 'undefined') {
            document.getElementById('status').innerText = `✅ Đã tải ${blogDatabase.length} dữ liệu. Sẵn sàng tìm kiếm!`;
        } else {
            document.getElementById('status').style.color = "red";
            document.getElementById('status').innerText = "❌ Lỗi: Không tìm thấy file database.js. Vui lòng đặt nó cùng thư mục với file index.html";
        }
    };

    // --- XỬ LÝ ẢNH ĐẦU VÀO ---
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const searchBtn = document.getElementById('searchBtn');

    fileInput.addEventListener('change', handleImage);
    
    // Hỗ trợ dán ảnh (Ctrl + V)
    document.addEventListener("paste", function(e) {
        let items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
            if (item.type.indexOf("image") === 0) {
                let file = item.getAsFile();
                loadImageFile(file);
            }
        }
    });

    function handleImage(e) {
        if (e.target.files && e.target.files[0]) loadImageFile(e.target.files[0]);
    }

    function loadImageFile(file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            preview.src = event.target.result;
            preview.style.display = 'block';
            
            uploadedImage = new Image();
            uploadedImage.src = event.target.result;
            uploadedImage.onload = function() {
                searchBtn.disabled = false; // Bật nút tìm kiếm
                document.getElementById('status').innerText = "Ảnh đã sẵn sàng. Bấm 'Tìm Kiếm Ngay'!";
            }
        }
        reader.readAsDataURL(file);
    }

    // --- THUẬT TOÁN HASH (GIỐNG HỆT CÔNG CỤ TẠO DATABASE) ---
    function computeDHash256(imgElement) {
        const canvas = document.createElement('canvas');
        canvas.width = 17; canvas.height = 16;
        const ctx = canvas.getContext('2d');
        
        // Tô nền trắng
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, 17, 16);

        // Bù viền, giữ nguyên tỷ lệ
        const scale = Math.min(17 / imgElement.width, 16 / imgElement.height);
        const w = imgElement.width * scale;
        const h = imgElement.height * scale;
        const x = (17 - w) / 2;
        const y = (16 - h) / 2;
        
        ctx.drawImage(imgElement, x, y, w, h);
        
        const imgData = ctx.getImageData(0, 0, 17, 16).data;
        let grayscale = [];
        for (let i = 0; i < imgData.length; i += 4) {
            let r = imgData[i], g = imgData[i+1], b = imgData[i+2], a = imgData[i+3] / 255;
            grayscale.push((r * 0.299 + g * 0.587 + b * 0.114) * a + 255 * (1 - a));
        }

        let hash = "";
        for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
                hash += (grayscale[y * 17 + x] > grayscale[y * 17 + x + 1]) ? "1" : "0";
            }
        }
        return hash;
    }

    // Tính khoảng cách Hamming
    function hammingDistance(hash1, hash2) {
        let distance = 0;
        for (let i = 0; i < 256; i++) {
            if (hash1[i] !== hash2[i]) distance++;
        }
        return distance;
    }

    // --- XỬ LÝ TÌM KIẾM ---
    function processSearch() {
        if (!uploadedImage || typeof blogDatabase === 'undefined') return;

        document.getElementById('status').innerText = "⏳ Đang quét dữ liệu...";
        searchBtn.disabled = true;

        setTimeout(() => {
            const targetHash = computeDHash256(uploadedImage);
            let matches = [];

            // Duyệt qua toàn bộ database
            for (let item of blogDatabase) {
                let dist = hammingDistance(targetHash, item.h);
                let similarity = ((256 - dist) / 256) * 100;
                
                if (similarity >= SIMILARITY_THRESHOLD) {
                    matches.push({
                        title: item.t,
                        url: item.u,
                        img: item.img,
                        sim: similarity
                    });
                }
            }

            // Sắp xếp giảm dần theo độ chính xác
            matches.sort((a, b) => b.sim - a.sim);
            renderResults(matches);
            
            searchBtn.disabled = false;
        }, 100); // Timeout nhỏ để UI kịp cập nhật chữ "Đang quét..."
    }

    // --- HIỂN THỊ KẾT QUẢ ---
    function renderResults(matches) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = "";

        if (matches.length === 0) {
            document.getElementById('status').innerText = "❌ Không tìm thấy kết quả nào phù hợp.";
            return;
        }

        document.getElementById('status').innerText = `✅ Tìm thấy ${matches.length} kết quả phù hợp!`;

        matches.forEach(item => {
            // Cắt bớt tiêu đề nếu quá dài
            let shortTitle = item.title.replace(" | Stamp IO VN", ""); 

            resultsDiv.innerHTML += `
                <a href="${item.url}" target="_blank" class="result-card">
                    <img src="${item.img}" class="result-img" alt="Tem">
                    <div class="result-info">
                        <p class="result-title">${shortTitle}</p>
                        <p class="result-sim">Độ giống: ${item.sim.toFixed(2)}%</p>
                    </div>
                </a>
            `;
        });
    }
</script>

</body>
</html>
