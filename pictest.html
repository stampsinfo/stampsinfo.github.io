<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Kiếm Bài Viết Qua Hình Ảnh</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .upload-area {
            border: 2px dashed #3498db;
            padding: 40px;
            border-radius: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-area:hover {
            background: #f0f8ff;
        }
        #preview {
            max-width: 300px;
            max-height: 300px;
            margin-top: 20px;
            border-radius: 5px;
            display: none;
        }
        button {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #2980b9;
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .match { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .no-match { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        a { color: #0056b3; font-weight: bold; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Tìm Kiếm Bài Viết Bằng Hình Ảnh</h2>
    <p>Tải lên một hình ảnh để tìm bài viết có hình ảnh tương đồng nhất của Blogger.</p>

    <div class="upload-area" onclick="document.getElementById('imageInput').click()">
        <p>Nhấp vào đây để chọn ảnh hoặc kéo thả ảnh vào đây</p>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
    </div>

    <img id="preview" src="" alt="Ảnh xem trước">
    <br>
    <button id="searchBtn" onclick="findMatchingArticle()" style="display: none;">Tìm Bài Viết</button>

    <div id="result"></div>
</div>

<script>
    // 1. CƠ SỞ DỮ LIỆU GIẢ LẬP (Database)
    // Trong thực tế, bạn cần tính toán trước mã hash (chuỗi 64 ký tự 0/1) của các ảnh trên blog
    // và lưu vào mảng này cùng đường dẫn bài viết tương ứng.
    JavaScript
    // 1. CƠ SỞ DỮ LIỆU TỪ FILE JSON
    let blogDatabase = []; // Khởi tạo mảng rỗng

    // Tự động tải file JSON ngay khi mở trang web
    fetch('./database.json')
        .then(response => {
            if (!response.ok) throw new Error("Không thể tải file JSON");
            return response.json(); // Lệnh này tự động thực hiện JSON.parse() bên dưới
        })
        .then(data => {
            blogDatabase = data;
            console.log("Đã tải xong CSDL:", blogDatabase.length, "bài viết");
        })
        .catch(error => {
            console.error("Lỗi:", error);
            alert("Lỗi tải cơ sở dữ liệu ảnh!");
        });

    let currentUploadedHash = "";

    // Hiển thị ảnh xem trước và tính toán mã Hash ngay khi người dùng chọn ảnh
    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.getElementById('preview');
            img.src = e.target.result;
            img.style.display = 'inline-block';
            document.getElementById('searchBtn').style.display = 'inline-block';
            document.getElementById('result').style.display = 'none';

            // Tạo đối tượng Image để vẽ lên Canvas và tính hash
            const tempImg = new Image();
            tempImg.onload = function() {
                currentUploadedHash = generateHash(tempImg);
                console.log("Mã Hash của ảnh tải lên:", currentUploadedHash);
            };
            tempImg.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    // 2. THUẬT TOÁN AVERAGE HASH (aHash)
    // Chuyển ảnh thành ma trận 8x8, đưa về trắng đen và tạo chuỗi 64 bit
    function generateHash(imageElement) {
        const canvas = document.createElement('canvas');
        canvas.width = 8;
        canvas.height = 8;
        const ctx = canvas.getContext('2d');
        
        // Nén ảnh về 8x8 pixel
        ctx.drawImage(imageElement, 0, 0, 8, 8);
        const imgData = ctx.getImageData(0, 0, 8, 8).data;
        
        let grayscale = [];
        let total = 0;

        // imgData chứa các giá trị R, G, B, A liên tiếp
        for (let i = 0; i < imgData.length; i += 4) {
            // Chuyển đổi sang mức độ xám (Grayscale)
            const gray = (imgData[i] + imgData[i+1] + imgData[i+2]) / 3;
            grayscale.push(gray);
            total += gray;
        }

        const average = total / 64;
        let hash = "";

        // So sánh từng pixel với giá trị trung bình
        for (let i = 0; i < 64; i++) {
            hash += grayscale[i] >= average ? "1" : "0";
        }
        return hash;
    }

    // 3. THUẬT TOÁN KHOẢNG CÁCH HAMMING
    // Đếm số lượng bit khác nhau giữa 2 mã hash
    function getHammingDistance(hash1, hash2) {
        let distance = 0;
        for (let i = 0; i < 64; i++) {
            if (hash1[i] !== hash2[i]) {
                distance++;
            }
        }
        return distance;
    }

    // 4. XỬ LÝ TÌM KIẾM VÀ SO SÁNH
    function findMatchingArticle() {
        if (!currentUploadedHash) {
            alert("Đang xử lý ảnh, vui lòng thử lại sau 1 giây!");
            return;
        }

        let bestMatch = null;
        let lowestDistance = 65; // Khoảng cách tối đa là 64

        // Duyệt qua toàn bộ cơ sở dữ liệu để tìm ảnh giống nhất
        blogDatabase.forEach(item => {
            const distance = getHammingDistance(currentUploadedHash, item.imageHash);
            if (distance < lowestDistance) {
                lowestDistance = distance;
                bestMatch = item;
            }
        });

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        // Đặt ngưỡng khác biệt (Threshold). 
        // Khoảng cách <= 10: Rất giống; > 15: Có thể là ảnh khác.
        if (lowestDistance <= 15) {
            resultDiv.className = 'match';
            resultDiv.innerHTML = `
                <h3>✅ Đã tìm thấy bài viết!</h3>
                <p>Bài viết có hình ảnh tương đồng nhất (Độ lệch: ${lowestDistance}/64):</p>
                <p><a href="${bestMatch.articleUrl}" target="_blank">${bestMatch.title}</a></p>
            `;
        } else {
            resultDiv.className = 'no-match';
            resultDiv.innerHTML = `
                <h3>❌ Không tìm thấy!</h3>
                <p>Không có hình ảnh nào trên Blog đủ giống với ảnh bạn cung cấp (Độ lệch nhỏ nhất: ${lowestDistance}/64).</p>
            `;
        }
    }
</script>

</body>
</html>
