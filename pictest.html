<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Tem Thông Minh (Chọn Tem Ngang / Dọc)</title>
    <!-- Nhúng sẵn file database.js vào trang -->
    <script src="database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: #0f172a; color: #fff; margin: 0; }
        .box { background: #1e293b; max-width: 850px; margin: 30px auto; padding: 30px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        .action-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .btn { border: none; padding: 12px 20px; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn:hover { opacity: 0.9; }
        .btn-choose { background: #3b82f6; }
        .btn-camera-vert { background: #10b981; } 
        .btn-camera-horiz { background: #8b5cf6; } 
        .btn-capture { background: #06b6d4; font-size: 15px; padding: 12px 24px; }
        .btn-stop { background: #ef4444; } 

        .drop-zone { border: 2px dashed #475569; padding: 25px; border-radius: 8px; background: #334155; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
        .drop-zone:hover { border-color: #38bdf8; background: #334155aa; }
        input[type="file"] { display: none; }
        
        #videoBox { display: none; background: #0f172a; border-radius: 12px; border: 2px solid #38bdf8; margin: 20px auto; padding: 15px; max-width: 450px; text-align: center; }
        
        /* Thay đổi khung hình xem trước camera tương ứng Ngang / Dọc */
        .video-container { position: relative; width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: auto; display: block; object-fit: cover; }
        
        /* Tỷ lệ khung hình hiển thị camera */
        .video-vertical { max-height: 400px; }
        .video-horizontal { max-height: 250px; }

        .camera-controls { display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
        #camModeTitle { color: #f59e0b; font-weight: bold; margin-bottom: 10px; font-size: 15px; }

        .media-container { margin: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        #previewImg { max-width: 200px; max-height: 200px; border-radius: 6px; display: none; border: 2px solid #64748b; }

        #resultBox { margin-top: 25px; background: #020617; padding: 20px; border-radius: 8px; text-align: left; border: 1px solid #334155; display: none; }
        .result-item { border-bottom: 1px dashed #334155; padding: 12px 0; }
        .result-item:last-child { border-bottom: none; }
        .result-title { margin: 0 0 5px 0; font-size: 15px; }
        .result-title a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        .result-title a:hover { text-decoration: underline; }
        .result-meta { margin: 0; font-size: 13px; }

        .loading { color: #f59e0b; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>🔍 TRA CỨU TEM THÔNG MINH</h2>
    <p>Chọn ảnh có sẵn từ máy hoặc chọn chế độ chụp Camera phù hợp với loại tem.</p>
    
    <div class="action-group">
        <button class="btn btn-choose" onclick="document.getElementById('fileInput').click()">📁 Chọn Ảnh Từ Máy</button>
        <button class="btn btn-camera-vert" onclick="startCamera('vertical')">🔲 Chụp Tem Dọc</button>
        <button class="btn btn-camera-horiz" onclick="startCamera('horizontal')">🖼️ Chụp Tem Ngang</button>
    </div>

    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">

    <!-- KHU VỰC CAMERA TÙY CHỌN -->
    <div id="videoBox">
        <div id="camModeTitle">Đang mở chế độ: Tem Dọc</div>
        <div class="video-container" id="videoContainerDiv">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <div class="camera-controls">
            <button class="btn btn-capture" onclick="captureSnapshot()">📸 Chụp Ngay</button>
            <button class="btn btn-stop" onclick="stopCamera()">✖ Đóng Camera</button>
        </div>
    </div>

    <div class="media-container">
        <img id="previewImg" alt="Ảnh xem trước">
    </div>

    <div id="loadingText" class="loading">⏳ Đang xử lý mã băm và tìm kiếm...</div>

    <div id="resultBox">
        <div id="resultContent"></div>
    </div>
</div>

<script>
    let mediaStream = null;
    let currentMode = 'vertical'; // Mặc định dọc

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            stopCamera();
            processImageFile(file);
        }
    }

    function processImageFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            loadImageAndRun(e.target.result, 'auto');
        };
        reader.readAsDataURL(file);
    }

    async function startCamera(mode) {
        currentMode = mode;
        const videoBox = document.getElementById('videoBox');
        const webcam = document.getElementById('webcam');
        const containerDiv = document.getElementById('videoContainerDiv');
        const modeTitle = document.getElementById('camModeTitle');

        if (mediaStream) {
            stopCamera();
        }

        if (mode === 'vertical') {
            modeTitle.innerText = "📌 Đang mở: Chế độ Chụp Tem Dọc";
            containerDiv.className = "video-container video-vertical";
        } else {
            modeTitle.innerText = "📌 Đang mở: Chế độ Chụp Tem Ngang";
            containerDiv.className = "video-container video-horizontal";
        }

        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, 
                audio: false 
            });
            webcam.srcObject = mediaStream;
            videoBox.style.display = 'block';
            videoBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            document.getElementById('previewImg').style.display = 'none';
            document.getElementById('resultBox').style.display = 'none';
        } catch (err) {
            alert("Không thể truy cập Camera! Vui lòng cấp quyền camera cho trình duyệt. Lỗi: " + err.message);
        }
    }

    function stopCamera() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        document.getElementById('videoBox').style.display = 'none';
    }

    function captureSnapshot() {
        const webcam = document.getElementById('webcam');
        if (!mediaStream) return;

        const canvas = document.createElement('canvas');
        canvas.width = webcam.videoWidth || 640;
        canvas.height = webcam.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg');
        let modeToRun = currentMode;
        stopCamera();
        loadImageAndRun(dataUrl, modeToRun);
    }

    function loadImageAndRun(dataUrl, mode) {
        const preview = document.getElementById('previewImg');
        preview.src = dataUrl;
        preview.style.display = 'inline-block';

        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('loadingText').style.display = 'block';

        const img = new Image();
        img.onload = function() {
            setTimeout(() => {
                try {
                    let inputHash = computeFixedDHash(img, mode);
                    searchDatabase(inputHash);
                } catch (err) {
                    alert("Lỗi xử lý ảnh: " + err.message);
                    document.getElementById('loadingText').style.display = 'none';
                }
            }, 50);
        };
        img.src = dataUrl;
    }

    // --- HÀM BĂM dHash THEO LỰA CHỌN CỐ ĐỊNH (NGANG / DỌC) ---
    function computeFixedDHash(imgElement, mode) {
        let isLandscape = false;
        if (mode === 'horizontal') isLandscape = true;
        else if (mode === 'vertical') isLandscape = false;
        else {
            // Trường hợp tải ảnh có sẵn từ máy -> tự nhận diện theo tỷ lệ ảnh
            isLandscape = imgElement.width > imgElement.height;
        }

        const canvas = document.createElement('canvas');
        // Tem dọc: Lưới 17x16 | Tem ngang: Lưới 16x17
        canvas.width = isLandscape ? 17 : 17;
        canvas.height = isLandscape ? 16 : 16;
        
        const cols = isLandscape ? 17 : 17;
        const rows = isLandscape ? 16 : 16;
        
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const scale = Math.min(canvas.width / imgElement.width, canvas.height / imgElement.height);
        const w = imgElement.width * scale;
        const h = imgElement.height * scale;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        
        ctx.drawImage(imgElement, x, y, w, h);
        
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let grayscale = [];
        for (let i = 0; i < imgData.length; i += 4) {
            let r = imgData[i], g = imgData[i+1], b = imgData[i+2], a = imgData[i+3] / 255;
            grayscale.push((r * 0.299 + g * 0.587 + b * 0.114) * a + 255 * (1 - a));
        }

        let hash = "";
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols - 1; x++) {
                hash += (grayscale[y * cols + x] > grayscale[y * cols + x + 1]) ? "1" : "0";
            }
        }
        return hash;
    }

    function hammingDistance(hash1, hash2) {
        if (!hash1 || !hash2 || hash1.length !== hash2.length) return 999;
        let dist = 0;
        for (let i = 0; i < hash1.length; i++) {
            if (hash1[i] !== hash2[i]) dist++;
        }
        return dist;
    }

    // --- TÌM KIẾM VÀ GOM NHÓM TÊN BÀI VIẾT DUY NHẤT ---
    function searchDatabase(inputHash) {
        document.getElementById('loadingText').style.display = 'none';

        if (typeof blogDatabase === 'undefined' || !Array.isArray(blogDatabase) || blogDatabase.length === 0) {
            alert("Không tìm thấy dữ liệu trong file database.js!");
            return;
        }

        let resultsMap = new Map(); // Dùng Map để gom nhóm theo đường dẫn bài viết (u)

        for (let item of blogDatabase) {
            let cost = hammingDistance(inputHash, item.h);
            
            // Nếu bài viết này chưa có trong danh sách, hoặc có điểm số tốt hơn (cost nhỏ hơn), cập nhật lại
            if (!resultsMap.has(item.u) || resultsMap.get(item.u).cost > cost) {
                resultsMap.set(item.u, { item: item, cost: cost });
            }
        }

        // Chuyển Map thành mảng và sắp xếp theo độ sai số tăng dần (khớp nhất lên đầu)
        let uniqueResults = Array.from(resultsMap.values());
        uniqueResults.sort((a, b) => a.cost - b.cost);

        // Lấy Top 5 bài viết độc lập tốt nhất
        let topResults = uniqueResults.slice(0, 5);

        let resultContent = document.getElementById('resultContent');
        let htmlContent = `<h3 style="margin-top:0; color:#4ade80;">✨ Top 5 Bài Viết Phù Hợp Nhất:</h3>`;
        
        topResults.forEach((res, index) => {
            let color = res.cost <= 45 ? "#4ade80" : (res.cost <= 80 ? "#f59e0b" : "#ef4444");
            let badgeText = res.cost <= 45 ? "Khớp rất tốt" : (res.cost <= 80 ? "Khớp tương đối" : "Sai số cao");

            htmlContent += `
                <div class="result-item">
                    <p class="result-title"><b>#${index + 1}.</b> <a href="${res.item.u}" target="_blank">${res.item.t}</a></p>
                    <p class="result-meta" style="color: ${color};">
                        Sai số Hamming: <b>${res.cost} bits</b> &bull; <span>${badgeText}</span>
                    </p>
                </div>
            `;
        });

        resultContent.innerHTML = htmlContent;
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
