<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Kiếm Tem Bưu Chính</title>
    <!-- Tải trực tiếp database.js (BẮT BUỘC PHẢI ĐỂ FILE database.js CÙNG THƯ MỤC) -->
    <script src="database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f5; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #2c3e50; }
        .upload-box { border: 2px dashed #3498db; padding: 30px; border-radius: 10px; background: #f7fbff; margin: 20px 0; cursor: pointer; transition: 0.3s; }
        .upload-box:hover { background: #eaf4fc; }
        input[type="file"] { display: none; }
        .btn-upload { background: #3498db; color: white; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; display: inline-block; }
        
        #preview { max-width: 250px; max-height: 250px; margin-top: 15px; display: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        
        /* CSS cho danh sách kết quả */
        #results { margin-top: 30px; text-align: left; }
        .result-item { display: flex; gap: 20px; align-items: center; background: #fdfdfd; border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-bottom: 15px; transition: 0.2s; }
        .result-item:hover { box-shadow: 0 4px 10px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .result-img { width: 100px; height: 100px; object-fit: cover; border-radius: 6px; }
        .result-info { flex: 1; }
        .result-info h3 { margin: 0 0 8px 0; font-size: 18px; color: #2c3e50; }
        .result-info a { color: #e74c3c; text-decoration: none; font-weight: bold; }
        .badge { background: #2ecc71; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge.warning { background: #f39c12; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Nhận Diện Tem Bưu Chính</h1>
    <p>Tải lên một bức ảnh chụp tem của bạn để hệ thống quét và tìm kiếm thông tin.</p>
    <p><i>Lưu ý: Hãy cắt (crop) ảnh sát viền con tem nhất có thể để nhận diện chính xác.</i></p>

    <label class="upload-box" for="imageInput">
        <div class="btn-upload">Tải Ảnh Lên (hoặc Chụp)</div>
        <input type="file" id="imageInput" accept="image/*">
        <br>
        <img id="preview" alt="Ảnh tải lên">
    </label>

    <div id="results"></div>
</div>

<script>
    // 1. Hàm tính Hash 256-bit (ĐỒNG BỘ VỚI TOOL TẠO DATABASE - CÓ GIỮ TỶ LỆ)
    function computeDHash256(imgElement) {
        const canvas = document.createElement('canvas');
        canvas.width = 17; canvas.height = 16;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, 17, 16);

        const scale = Math.min(17 / imgElement.width, 16 / imgElement.height);
        const w = imgElement.width * scale;
        const h = imgElement.height * scale;
        const x = (17 - w) / 2;
        const y = (16 - h) / 2;
        
        ctx.drawImage(imgElement, x, y, w, h);
        
        const imgData = ctx.getImageData(0, 0, 17, 16).data;
        let grayscale = [];
        for (let i = 0; i < imgData.length; i += 4) {
            let r = imgData[i], g = imgData[i+1], b = imgData[i+2], a = imgData[i+3] / 255;
            grayscale.push((r * 0.299 + g * 0.587 + b * 0.114) * a + 255 * (1 - a));
        }

        let hash = "";
        for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
                hash += (grayscale[y * 17 + x] > grayscale[y * 17 + x + 1]) ? "1" : "0";
            }
        }
        return hash;
    }

    // 2. Hàm đếm số bit khác biệt (Hamming Distance)
    function getHammingDistance(hash1, hash2) {
        if (!hash1 || !hash2 || hash1.length !== hash2.length) return 256;
        let distance = 0;
        for (let i = 0; i < hash1.length; i++) {
            if (hash1[i] !== hash2[i]) distance++;
        }
        return distance;
    }

    // 3. Hàm Xử lý khi người dùng chọn ảnh
    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = "<h3>⏳ Đang xử lý và quét dữ liệu...</h3>";

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                // Hiển thị ảnh xem trước
                const preview = document.getElementById('preview');
                preview.src = event.target.result;
                preview.style.display = "inline-block";

                // Tính Hash ảnh người dùng
                const userHash = computeDHash256(img);
                
                // Gọi hàm tìm kiếm
                searchStamps(userHash);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // 4. Hàm Quét Database và Hiển thị
    function searchStamps(userHash) {
        const resultsDiv = document.getElementById('results');
        
        if (typeof blogDatabase === 'undefined') {
            resultsDiv.innerHTML = "<h3 style='color:red;'>Lỗi: Chưa kết nối được với Dữ liệu (database.js).</h3>";
            return;
        }

        let matchedResults = [];
        const MAX_DISTANCE = 40; // Ngưỡng chấp nhận sai số tối đa (40 bit)

        // Quét toàn bộ dữ liệu
        for (let i = 0; i < blogDatabase.length; i++) {
            let item = blogDatabase[i];
            let diff = getHammingDistance(userHash, item.h);

            if (diff <= MAX_DISTANCE) {
                let matchPercent = ((256 - diff) / 256) * 100;
                matchedResults.push({
                    ...item,
                    diffBits: diff,
                    matchScore: matchPercent.toFixed(1)
                });
            }
        }

        // Xếp hạng từ giống nhất đến ít giống nhất
        matchedResults.sort((a, b) => a.diffBits - b.diffBits);

        // Hiển thị ra màn hình
        if (matchedResults.length === 0) {
            resultsDiv.innerHTML = "<h3>😔 Không tìm thấy con tem nào phù hợp trong dữ liệu.</h3><p>Hãy thử cắt ảnh sát viền tem hơn và thử lại.</p>";
            return;
        }

        let html = `<h3>🎉 Tìm thấy ${matchedResults.length} kết quả phù hợp:</h3>`;
        
        matchedResults.forEach(item => {
            // Đánh giá mức độ khớp
            let badgeClass = item.diffBits <= 25 ? "badge" : "badge warning";
            let badgeText = item.diffBits <= 25 ? "Khớp Cao" : "Có Thể Khớp";

            html += `
            <div class="result-item">
                <img src="${item.img}" class="result-img" alt="Tem">
                <div class="result-info">
                    <h3>${item.t}</h3>
                    <p>
                        <span class="${badgeClass}">${badgeText}</span> 
                        Độ chính xác: <b>${item.matchScore}%</b> (Sai số: ${item.diffBits} bit)
                    </p>
                    <a href="${item.u}" target="_blank">Xem chi tiết bài viết ➔</a>
                </div>
            </div>`;
        });

        resultsDiv.innerHTML = html;
    }
</script>

</body>
</html>
