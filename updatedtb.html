<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Cập Nhật Database Tem (Auto GitHub)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f4f6f9; color: #333; }
        .box { background: #fff; max-width: 700px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; text-align: center; }
        p { color: #666; font-size: 15px; text-align: center; margin-bottom: 25px; }
        button { background: #28a745; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #log { margin-top: 20px; text-align: left; background: #1e1e1e; color: #4ec9b0; padding: 15px; font-family: 'Consolas', monospace; height: 400px; overflow-y: auto; border-radius: 8px; font-size: 13px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="box">
    <h2>🛠️ Quản Lý Database Nhận Diện Tem</h2>
    <p>Hệ thống tự động tìm <code>database.js</code> trên GitHub, giữ tỷ lệ ảnh gốc (Letterboxing) và chỉ quét các tem mới.</p>
    
    <button id="startBtn" onclick="startProcessing()">🚀 Bắt Đầu Quét & Cập Nhật</button>
    
    <div id="log">Sẵn sàng...</div>
</div>

<script>
    const BLOG_URL = "https://www.stamp.io.vn"; // Thay URL blog của bạn nếu cần
    let oldDatabase = [];
    let existingImgUrls = new Set();

    function log(msg, color = "#4ec9b0") {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<span style="color: ${color}">${msg}</span><br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function fetchFeedJSONP(url) {
        return new Promise((resolve, reject) => {
            const callbackName = 'bloggerCallback_' + Math.floor(Math.random() * 1000000);
            window[callbackName] = function(data) { delete window[callbackName]; resolve(data); };
            const script = document.createElement('script');
            script.src = `${url}${url.includes('?') ? '&' : '?'}alt=json-in-script&callback=${callbackName}`;
            script.onerror = () => reject(new Error("Lỗi tải feed"));
            document.body.appendChild(script);
        });
    }

    // Hàm tính Hash 256-bit (ĐÃ CẬP NHẬT GIỮ TỶ LỆ KHUNG HÌNH)
    function computeDHash256(imgElement) {
        const canvas = document.createElement('canvas');
        canvas.width = 17; canvas.height = 16;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, 17, 16);

        const scale = Math.min(17 / imgElement.width, 16 / imgElement.height);
        const w = imgElement.width * scale;
        const h = imgElement.height * scale;
        const x = (17 - w) / 2;
        const y = (16 - h) / 2;
        
        ctx.drawImage(imgElement, x, y, w, h);
        
        const imgData = ctx.getImageData(0, 0, 17, 16).data;
        let grayscale = [];
        for (let i = 0; i < imgData.length; i += 4) {
            let r = imgData[i], g = imgData[i+1], b = imgData[i+2], a = imgData[i+3] / 255;
            grayscale.push((r * 0.299 + g * 0.587 + b * 0.114) * a + 255 * (1 - a));
        }

        let hash = "";
        for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
                hash += (grayscale[y * 17 + x] > grayscale[y * 17 + x + 1]) ? "1" : "0";
            }
        }
        return hash;
    }

    // Vượt CORS & Chống Cache 304
    function loadImageAndHash(imgUrl) {
        return new Promise((resolve) => {
            const cacheBuster = "?t=" + new Date().getTime() + Math.random();
            const urlWithCacheBuster = imgUrl + (imgUrl.includes('?') ? '&' : '?') + "t=" + new Date().getTime();

            const proxy1 = "https://api.allorigins.win/raw?url=" + encodeURIComponent(urlWithCacheBuster);
            loadImg(proxy1).then(hash1 => {
                if (hash1) resolve(hash1);
                else {
                    const proxy2 = "https://wsrv.nl/?url=" + encodeURIComponent(imgUrl) + "&t=" + new Date().getTime();
                    loadImg(proxy2).then(hash2 => {
                        if (hash2) resolve(hash2);
                        else loadImg(urlWithCacheBuster).then(resolve); 
                    });
                }
            });
        });
    }

    function loadImg(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => { try { resolve(computeDHash256(img)); } catch (e) { resolve(null); } };
            img.onerror = () => resolve(null);
            img.src = url;
        });
    }

    async function startProcessing() {
        document.getElementById('startBtn').disabled = true;
        log("🔄 Đang tìm file <code>database.js</code> trên GitHub...");
        
        await new Promise((resolve) => {
            const script = document.createElement('script');
            script.src = 'database.js?t=' + new Date().getTime(); 
            script.onload = () => {
                if (typeof blogDatabase !== 'undefined') {
                    oldDatabase = blogDatabase;
                    existingImgUrls = new Set(oldDatabase.map(item => item.img));
                    log(`✅ Đã nạp Database cũ: <b>${oldDatabase.length}</b> hình ảnh.`, "#ffdd59");
                }
                resolve();
            };
            script.onerror = () => { log("⚠️ Không tìm thấy Database cũ. Quét mới hoàn toàn.", "#eccc68"); resolve(); };
            document.head.appendChild(script);
        });

        log("<br>🔄 Đang quét bài viết từ Blogger...");
        let start = 1; let max = 150; let entries = [];

        while (true) {
            try {
                let data = await fetchFeedJSONP(`${BLOG_URL}/feeds/posts/default?max-results=${max}&start-index=${start}`);
                let pageEntries = data.feed ? (data.feed.entry || []) : [];
                if (pageEntries.length === 0) break;
                entries.push(...pageEntries);
                if (start + max > parseInt(data.feed.openSearch$totalResults.$t)) break;
                start += max;
            } catch (e) { log("❌ Lỗi đọc Feed!", "#ff6b6b"); break; }
        }

        log(`📥 Tìm thấy ${entries.length} bài viết. Bắt đầu đối chiếu và xử lý ảnh...`);
        let newRecords = []; 
        let skipCount = 0;   

        for (let entry of entries) {
            let title = entry.title ? entry.title.$t : "Không tiêu đề";
            let postUrl = (entry.link || []).find(l => l.rel === "alternate")?.href;
            if (!postUrl) continue;

            let htmlContent = (entry.content?.t || entry.summary?.t || "");
            let div = document.createElement('div'); div.innerHTML = htmlContent;
            
            let imgs = Array.from(div.querySelectorAll('img')).map(i => i.src).filter(src => src && src.startsWith('http'));
            if (imgs.length === 0 && entry.media$thumbnail) imgs.push(entry.media$thumbnail.url.replace(/\/(s\d+(-c)?|w\d+-h\d+[^/]*)\//, '/s500/'));
            
            for (let imgUrl of [...new Set(imgs)]) {
                let cleanUrl = imgUrl.replace(/^http:/, 'https:');
                if (existingImgUrls.has(cleanUrl)) { skipCount++; continue; }
                
                let hash = await loadImageAndHash(cleanUrl);
                if (hash) {
                    newRecords.push({ t: title, u: postUrl, img: cleanUrl, h: hash });
                    existingImgUrls.add(cleanUrl); 
                    log(`✨ [Thêm Mới] ${title.substring(0, 30)}...`);
                }
            }
        }

        let finalDatabase = oldDatabase.concat(newRecords);
        log(`<br>🎉 <b>HOÀN THÀNH!</b>`, "#2ed573");
        log(`- Giữ nguyên: ${oldDatabase.length} | Bỏ qua trùng: ${skipCount} | Thêm mới: <b>${newRecords.length}</b>`);
        log(`👉 Tổng database hiện tại: <b>${finalDatabase.length} ảnh</b>.`);
        
        if (newRecords.length > 0) {
            const jsContent = `var blogDatabase = JSON.parse(\`${JSON.stringify(finalDatabase).replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\${/g, '\\${')}\`);\n`;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([jsContent], { type: 'text/javascript' }));
            a.download = 'database.js';
            a.click();
            log("<br>💾 Đã tải file <b>database.js</b> về máy. Vui lòng upload đè lên GitHub!", "#2ed573");
        } else {
            log("<br>💡 Database đã ở trạng thái mới nhất!", "#ffdd59");
        }
        document.getElementById('startBtn').disabled = false;
    }
</script>
</body>
</html>
