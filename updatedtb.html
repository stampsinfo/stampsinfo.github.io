<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Công Cụ Cập Nhật Database Blogger (Auto GitHub)</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 30px; background: #f4f6f9; color: #333; }
        .box { background: #fff; max-width: 650px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #2c3e50; margin-top: 0; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        button { background: #28a745; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; width: 100%; }
        button:hover { background: #218838; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #log { margin-top: 20px; text-align: left; background: #1e1e1e; color: #4ec9b0; padding: 15px; font-family: 'Consolas', monospace; height: 350px; overflow-y: auto; border-radius: 6px; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="box">
    <h2>🛠️ Cập Nhật database.js (Tự động)</h2>
    <p>Hệ thống sẽ tự động tìm file <code>database.js</code> trên GitHub của bạn, nạp dữ liệu cũ và chỉ quét thêm những ảnh mới.</p>
    
    <button id="startBtn" onclick="startProcessing()">🚀 Bắt Đầu Quét & Cập Nhật</button>
    
    <div id="log">Sẵn sàng...</div>
</div>

<script>
    const BLOG_URL = "https://www.stamp.io.vn";
    let oldDatabase = [];
    let existingImgUrls = new Set();

    function log(msg, color = "#4ec9b0") {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<span style="color: ${color}">${msg}</span><br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // --- CÁC HÀM CỐT LÕI (JSONP, HASH, PROXY) ---
    function fetchFeedJSONP(url) {
        return new Promise((resolve, reject) => {
            const callbackName = 'bloggerCallback_' + Math.floor(Math.random() * 1000000);
            window[callbackName] = function(data) {
                delete window[callbackName];
                resolve(data);
            };
            const script = document.createElement('script');
            const sep = url.includes('?') ? '&' : '?';
            script.src = `${url}${sep}alt=json-in-script&callback=${callbackName}`;
            script.onerror = () => reject(new Error("Lỗi tải script feed"));
            document.body.appendChild(script);
        });
    }

    function computeDHash256(imgElement) {
        const canvas = document.createElement('canvas');
        canvas.width = 17; canvas.height = 16;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgElement, 0, 0, 17, 16);
        const imgData = ctx.getImageData(0, 0, 17, 16).data;
        let grayscale = [];
        for (let i = 0; i < imgData.length; i += 4) {
            let r = imgData[i], g = imgData[i+1], b = imgData[i+2], a = imgData[i+3] / 255;
            let gray = (r * 0.299 + g * 0.587 + b * 0.114) * a + 255 * (1 - a);
            grayscale.push(gray);
        }
        let hash = "";
        for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
                hash += (grayscale[y * 17 + x] > grayscale[y * 17 + x + 1]) ? "1" : "0";
            }
        }
        return hash;
    }

    function loadImageAndHash(imgUrl) {
        return new Promise((resolve) => {
            const cacheBuster = "?t=" + new Date().getTime() + Math.random();
            const urlWithCacheBuster = imgUrl + (imgUrl.includes('?') ? '&' : '?') + "t=" + new Date().getTime();

            const proxy1 = "https://api.allorigins.win/raw?url=" + encodeURIComponent(urlWithCacheBuster);
            loadImg(proxy1).then(hash1 => {
                if (hash1) resolve(hash1);
                else {
                    const proxy2 = "https://wsrv.nl/?url=" + encodeURIComponent(imgUrl) + "&t=" + new Date().getTime();
                    loadImg(proxy2).then(hash2 => {
                        if (hash2) resolve(hash2);
                        else {
                            loadImg(urlWithCacheBuster).then(resolve); 
                        }
                    });
                }
            });
        });
    }

    function loadImg(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => { try { resolve(computeDHash256(img)); } catch (e) { resolve(null); } };
            img.onerror = () => resolve(null);
            img.src = url;
        });
    }

    // --- HÀM CHẠY CHÍNH ---
    async function startProcessing() {
        document.getElementById('startBtn').disabled = true;
        
        // BƯỚC 1: TỰ ĐỘNG TÌM VÀ NẠP FILE DATABASE.JS TRÊN GITHUB
        log("🔄 Đang tìm file <code>database.js</code> cũ trên hệ thống...");
        
        await new Promise((resolve) => {
            const script = document.createElement('script');
            // Gắn timestamp để luôn lấy file mới nhất, tránh cache của GitHub Pages
            script.src = 'database.js?t=' + new Date().getTime(); 
            
            script.onload = () => {
                if (typeof blogDatabase !== 'undefined') {
                    oldDatabase = blogDatabase;
                    existingImgUrls = new Set(oldDatabase.map(item => item.img));
                    log(`✅ Tự động nạp thành công Database cũ: Có sẵn <b>${oldDatabase.length}</b> hình ảnh.`, "#ffdd59");
                }
                resolve();
            };
            
            script.onerror = () => {
                log("⚠️ Không tìm thấy Database cũ (hoặc đây là lần đầu chạy). Sẽ quét từ đầu.", "#eccc68");
                resolve();
            };
            
            document.head.appendChild(script);
        });

        // BƯỚC 2: QUÉT BÀI VIẾT MỚI
        log("<br>🔄 Đang quét danh sách bài viết từ Blogger...");
        
        let start = 1; let max = 150; let entries = [];

        while (true) {
            let feedUrl = `${BLOG_URL}/feeds/posts/default?max-results=${max}&start-index=${start}`;
            try {
                let data = await fetchFeedJSONP(feedUrl);
                let pageEntries = data.feed ? (data.feed.entry || []) : [];
                if (pageEntries.length === 0) break;
                
                entries.push(...pageEntries);
                let total = parseInt(data.feed.openSearch$totalResults ? data.feed.openSearch$totalResults.$t : 0);
                
                if (start + max > total) break;
                start += max;
            } catch (e) {
                log("❌ Lỗi đọc dữ liệu Feed!", "#ff6b6b");
                break;
            }
        }

        log(`📥 Tìm thấy tổng cộng ${entries.length} bài viết. Bắt đầu đối chiếu dữ liệu...`);

        let newRecords = []; 
        let skipCount = 0;   

        for (let entry of entries) {
            let title = entry.title ? entry.title.$t : "Không tiêu đề";
            let postUrl = "";
            (entry.link || []).forEach(l => { if (l.rel === "alternate") postUrl = l.href; });

            if (!postUrl) continue;

            let htmlContent = (entry.content ? entry.content.$t : "") || (entry.summary ? entry.summary.$t : "");
            let div = document.createElement('div');
            div.innerHTML = htmlContent;
            
            let imgs = Array.from(div.querySelectorAll('img')).map(i => i.src).filter(src => src && src.startsWith('http'));

            if (imgs.length === 0 && entry.media$thumbnail) {
                let thumb = entry.media$thumbnail.url.replace(/\/(s\d+(-c)?|w\d+-h\d+[^/]*)\//, '/s500/');
                imgs.push(thumb);
            }

            imgs = [...new Set(imgs)];

            for (let imgUrl of imgs) {
                let cleanUrl = imgUrl.replace(/^http:/, 'https:');
                
                // KIỂM TRA: Nếu ảnh đã có trong GitHub -> Bỏ qua
                if (existingImgUrls.has(cleanUrl)) {
                    skipCount++;
                    continue; 
                }
                
                // NẾU LÀ ẢNH MỚI TINH -> TÍNH HASH
                let hash = await loadImageAndHash(cleanUrl);
                
                if (hash) {
                    newRecords.push({ t: title, u: postUrl, img: cleanUrl, h: hash });
                    existingImgUrls.add(cleanUrl); 
                    log(`✨ [Thêm Mới] ${title.substring(0, 30)}...`);
                }
            }
        }

        // TỔNG HỢP VÀ TẢI XUỐNG
        let finalDatabase = oldDatabase.concat(newRecords);

        log(`<br>🎉 <b>HOÀN THÀNH TỔNG HỢP!</b>`, "#2ed573");
        log(`- Giữ nguyên: ${oldDatabase.length} ảnh cũ.`);
        log(`- Lướt qua: ${skipCount} ảnh do đã có sẵn.`);
        if (newRecords.length > 0) {
            log(`- Cập nhật thêm: <b>${newRecords.length}</b> ảnh mới.`);
        } else {
            log(`- <b>Không có ảnh nào mới để thêm!</b>`);
        }
        
        log(`👉 Tổng số lượng trong database mới: <b>${finalDatabase.length} ảnh</b>.`);
        
        // Mẹo: Dùng "var" thay cho "const" để tránh lỗi biến khi trình duyệt load lại file lần 2
        const jsonStr = JSON.stringify(finalDatabase);
        const jsonEscaped = jsonStr.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\${/g, '\\${');
        const jsContent = `var blogDatabase = JSON.parse(\`${jsonEscaped}\`);\n`;

        // Tải xuống file mới
        const blob = new Blob([jsContent], { type: 'text/javascript' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'database.js';
        a.click();

        if (newRecords.length > 0) {
            log("<br>💾 File <b>database.js</b> đã tải về máy. Hãy upload đè lên file cũ trên GitHub!", "#2ed573");
        } else {
            log("<br>💡 Web của bạn đã ở trạng thái mới nhất, không cần phải upload file mới.", "#ffdd59");
        }
        
        document.getElementById('startBtn').disabled = false;
    }
</script>

</body>
</html>
