<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Tăng Dần Database Tem (Tự Động Tải Từ Repo)</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: #0f172a; color: #fff; }
        .box { background: #1e293b; max-width: 850px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        .upload-section { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #475569; text-align: left; }
        .upload-section label { font-weight: bold; color: #cbd5e1; display: block; margin-bottom: 8px; font-size: 13px; }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        button { border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; color: white; }
        .btn-start { background: #10b981; } .btn-start:hover { background: #059669; }
        .btn-download { background: #8b5cf6; } .btn-download:hover { background: #7c3aed; }
        button:disabled { background: #475569 !important; cursor: not-allowed; opacity: 0.6; }

        #statusBox { background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; color: #f59e0b; border: 1px solid #334155; }
        #log { text-align: left; background: #020617; color: #4ade80; padding: 15px; font-family: 'Consolas', monospace; height: 350px; overflow-y: auto; border-radius: 8px; font-size: 13px; line-height: 1.6; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="box">
    <h2>⚡ CẬP NHẬT TĂNG DẦN DATABASE (TỰ ĐỘNG TỪ REPO)</h2>
    <p>Hệ thống sẽ tự động lấy file <code>database.js</code> đang có sẵn trên cùng thư mục GitHub để so sánh và bổ sung tem mới.</p>
    
    <div id="statusBox">⏳ Đang tự động tải database.js từ repo...</div>

    <div class="btn-group">
        <button id="btnStartUpdate" class="btn-start" onclick="startIncrementalScan()" disabled>🚀 Bắt Đầu Quét & Cập Nhật Mới</button>
        <button id="btnDownload" class="btn-download" onclick="downloadUpdatedDB()" disabled>💾 Tải database.js Đã Cập Nhật</button>
    </div>

    <!-- Phần dự phòng nếu chạy test dưới máy tính bị lỗi CORS -->
    <details class="upload-section">
        <summary style="cursor: pointer; color: #38bdf8; font-weight: bold; font-size: 13px;">⚙️ Tùy chọn nâng cao: Tải file thủ công (Nếu chạy dưới máy tính cá nhân)</summary>
        <br>
        <label>📂 Chọn file <code>database.js</code> thủ công từ máy:</label>
        <input type="file" id="oldDbFile" accept=".js" onchange="loadManualDatabase(event)">
    </details>
    
    <div id="log">Hệ thống sẵn sàng...</div>
</div>

<script>
    const BLOG_URL = "https://www.stamp.io.vn"; // URL Blog của bạn
    let existingDatabase = [];
    let existingImageUrls = new Set();
    let updatedDatabase = [];
    let isRunning = false;

    function log(msg, color = "#4ade80") {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<span style="color: ${color}">${msg}</span><br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setStatus(msg) {
        document.getElementById('statusBox').innerHTML = msg;
    }

    // --- 1. TỰ ĐỘNG TẢI DATABASE TỪ REPO KHI MỞ TRANG ---
    window.onload = async function() {
        try {
            log("[Hệ thống] Đang cố gắng tải database.js từ cùng thư mục trên Repo...", "#38bdf8");
            let response = await fetch('./database.js?t=' + new Date().getTime());
            if (!response.ok) throw new Error("Không tìm thấy file database.js cùng thư mục.");
            
            let content = await response.text();
            parseAndLoadDatabase(content);
            log("✅ Tự động tải database.js từ Repo thành công!", "#4ade80");
        } catch (err) {
            setStatus("⚠️ Không thể tự động tải file từ Repo (Có thể do chạy trực tiếp từ máy tính). Vui lòng dùng mục tùy chọn bên dưới để chọn file thủ công.");
            log("⚠️ Không thể tự động tải file: " + err.message, "#f59e0b");
        }
    };

    function parseAndLoadDatabase(content) {
        let match = content.match(/\[[\s\S]*\]/);
        if (match) {
            existingDatabase = JSON.parse(match[0]);
            existingImageUrls = new Set(existingDatabase.map(item => item.img));
            
            setStatus(`✅ Đã nạp thành công từ Repo: <b>${existingDatabase.length}</b> tem. Sẵn sàng cập nhật!`);
            document.getElementById('btnStartUpdate').disabled = false;
            log(`[Hệ thống] Đã nạp thành công database cũ gồm ${existingDatabase.length} tem.`, "#38bdf8");
        } else {
            alert("Cấu trúc file database.js không hợp lệ!");
        }
    }

    function loadManualDatabase(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            parseAndLoadDatabase(e.target.result);
        };
        reader.readAsText(file);
    }

    // --- 2. THUẬT TOÁN HASH & FEED BLOGGER ---
    function fetchFeedJSONP(url) {
        return new Promise((resolve, reject) => {
            const callbackName = 'bloggerCallback_' + Math.floor(Math.random() * 1000000);
            window[callbackName] = function(data) { delete window[callbackName]; resolve(data); };
            const script = document.createElement('script');
            script.src = `${url}${url.includes('?') ? '&' : '?'}alt=json-in-script&callback=${callbackName}`;
            script.onerror = () => reject(new Error("Lỗi tải feed"));
            document.body.appendChild(script);
        });
    }

    function computeDHash256(imgElement) {
        const canvas = document.createElement('canvas');
        canvas.width = 17; canvas.height = 16;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, 17, 16);

        const scale = Math.min(17 / imgElement.width, 16 / imgElement.height);
        const w = imgElement.width * scale;
        const h = imgElement.height * scale;
        const x = (17 - w) / 2;
        const y = (16 - h) / 2;
        
        ctx.drawImage(imgElement, x, y, w, h);
        
        const imgData = ctx.getImageData(0, 0, 17, 16).data;
        let grayscale = [];
        for (let i = 0; i < imgData.length; i += 4) {
            let r = imgData[i], g = imgData[i+1], b = imgData[i+2], a = imgData[i+3] / 255;
            grayscale.push((r * 0.299 + g * 0.587 + b * 0.114) * a + 255 * (1 - a));
        }

        let hash = "";
        for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
                hash += (grayscale[y * 17 + x] > grayscale[y * 17 + x + 1]) ? "1" : "0";
            }
        }
        return hash;
    }

    function loadImageAndHash(imgUrl) {
        return new Promise((resolve) => {
            const urlWithCacheBuster = imgUrl + (imgUrl.includes('?') ? '&' : '?') + "t=" + new Date().getTime();
            const proxy1 = "https://api.allorigins.win/raw?url=" + encodeURIComponent(urlWithCacheBuster);
            
            loadImg(proxy1).then(hash1 => {
                if (hash1) resolve(hash1);
                else {
                    const proxy2 = "https://wsrv.nl/?url=" + encodeURIComponent(imgUrl) + "&t=" + new Date().getTime();
                    loadImg(proxy2).then(hash2 => {
                        if (hash2) resolve(hash2);
                        else loadImg(urlWithCacheBuster).then(resolve); 
                    });
                }
            });
        });
    }

    function loadImg(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => { try { resolve(computeDHash256(img)); } catch (e) { resolve(null); } };
            img.onerror = () => resolve(null);
            img.src = url;
        });
    }

    // --- 3. TIẾN TRÌNH QUÉT VÀ CẬP NHẬT TĂNG DẦN ---
    async function startIncrementalScan() {
        if (existingDatabase.length === 0) {
            alert("Chưa có dữ liệu database cũ được tải!");
            return;
        }

        isRunning = true;
        document.getElementById('btnStartUpdate').disabled = true;

        log("<br>🔄 <b>Đang quét danh sách bài viết từ Blogger để tìm điểm mới...</b>", "#38bdf8");

        let allEntries = [];
        let start = 1; let max = 150;
        while (true) {
            try {
                let data = await fetchFeedJSONP(`${BLOG_URL}/feeds/posts/default?max-results=${max}&start-index=${start}`);
                let pageEntries = data.feed ? (data.feed.entry || []) : [];
                if (pageEntries.length === 0) break;
                
                allEntries.push(...pageEntries);
                let total = parseInt(data.feed.openSearch$totalResults.$t);
                if (start + max > total) break;
                start += max;
            } catch (e) { 
                log("❌ Lỗi khi đọc feed từ Blogger!", "#ef4444"); 
                isRunning = false;
                document.getElementById('btnStartUpdate').disabled = false;
                return; 
            }
        }

        log(`📦 Đã đọc thấy tổng cộng ${allEntries.length} bài viết trên blog. Đang lọc các bài mới...`, "#38bdf8");

        let newlyAddedCount = 0;
        updatedDatabase = [...existingDatabase];

        for (let i = 0; i < allEntries.length; i++) {
            let entry = allEntries[i];
            let title = entry.title ? entry.title.$t : "Không tiêu đề";
            let postUrl = (entry.link || []).find(l => l.rel === "alternate")?.href;
            if (!postUrl) continue;

            setStatus(`⏳ Đang kiểm tra [Bài ${i + 1}/${allEntries.length}]: ${title.substring(0, 30)}...`);

            let htmlContent = (entry.content?.t || entry.summary?.t || "");
            let div = document.createElement('div'); div.innerHTML = htmlContent;
            
            let imgs = Array.from(div.querySelectorAll('img')).map(i => i.src).filter(src => src && src.startsWith('http'));
            if (imgs.length === 0 && entry.media$thumbnail) {
                imgs.push(entry.media$thumbnail.url.replace(/\/(s\d+(-c)?|w\d+-h\d+[^/]*)\//, '/s500/'));
            }
            imgs = [...new Set(imgs)];

            let newImgsForThisPost = imgs.filter(imgUrl => {
                let cleanUrl = imgUrl.replace(/^http:/, 'https:');
                return !existingImageUrls.has(cleanUrl);
            });

            if (newImgsForThisPost.length === 0) continue; 

            log(`✨ Phát hiện bài viết mới/có ảnh mới: <b>${title}</b> (${newImgsForThisPost.length} ảnh mới)`, "#f59e0b");

            for (let imgUrl of newImgsForThisPost) {
                let cleanUrl = imgUrl.replace(/^http:/, 'https:');
                if (existingImageUrls.has(cleanUrl)) continue;

                let hash = await loadImageAndHash(cleanUrl);
                if (hash) {
                    let newItem = { t: title, u: postUrl, img: cleanUrl, h: hash };
                    updatedDatabase.push(newItem);
                    existingImageUrls.add(cleanUrl);
                    newlyAddedCount++;
                    log(`➕ Thêm tem mới [#${newlyAddedCount}]: ${cleanUrl.substring(0, 50)}...`);
                }
            }
        }

        isRunning = false;
        setStatus(`🎉 Cập nhật hoàn tất! Đã thêm mới ${newlyAddedCount} tem. Tổng cộng: ${updatedDatabase.length} tem.`);
        log(`<br>🎉 <b>QUÉT CẬP NHẬT HOÀN TẤT!</b> Đã bổ sung thành công <b>${newlyAddedCount}</b> tem mới.`, "#4ade80");
        document.getElementById('btnDownload').disabled = false;
        document.getElementById('btnStartUpdate').disabled = false;
    }

    // --- 4. TẢI FILE DATABASE.JS MỚI ---
    function downloadUpdatedDB() {
        if (updatedDatabase.length === 0) {
            alert("Chưa có dữ liệu!");
            return;
        }
        let jsonStr = JSON.stringify(updatedDatabase);
        let jsContent = `var blogDatabase = JSON.parse(String.raw\`${jsonStr}\`);\n`;
        
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([jsContent], { type: 'text/javascript' }));
        a.download = 'database.js';
        a.click();
        log("💾 Đã tải file <b>database.js</b> phiên bản cập nhật mới nhất!", "#38bdf8");
    }
</script>
</body>
</html>
