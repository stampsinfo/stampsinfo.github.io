<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Công Cụ Tạo Database Blogger (JSONP CORS-Free)</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 30px; background: #f4f6f9; color: #333; }
        .box { background: #fff; max-width: 650px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #2c3e50; margin-top: 0; }
        p { color: #666; font-size: 14px; }
        button { background: #007bff; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #log { margin-top: 20px; text-align: left; background: #1e1e1e; color: #4ec9b0; padding: 15px; font-family: 'Consolas', monospace; height: 280px; overflow-y: auto; border-radius: 6px; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="box">
    <h2>🛠️ Công Cụ Tạo database.js (JSONP - Không Lỗi CORS)</h2>
    <p>Tự động đọc bài viết từ <b>stamp.io.vn</b> qua cổng JSONP và tính mã dHash 256-bit trực tiếp trên trình duyệt.</p>
    <button id="startBtn" onclick="startProcessing()">🚀 Bắt Đầu Tạo Database</button>
    <div id="log">Sẵn sàng... Bấm nút trên để bắt đầu!</div>
</div>

<script>
    const BLOG_URL = "https://www.stamp.io.vn";

    function log(msg, color = "#4ec9b0") {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<span style="color: ${color}">${msg}</span><br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Tải Feed bằng JSONP - Bỏ qua 100% rào cản CORS của trình duyệt
    function fetchFeedJSONP(url) {
        return new Promise((resolve, reject) => {
            const callbackName = 'bloggerCallback_' + Math.floor(Math.random() * 1000000);
            
            window[callbackName] = function(data) {
                delete window[callbackName];
                if (script.parentNode) document.body.removeChild(script);
                resolve(data);
            };

            const script = document.createElement('script');
            const sep = url.includes('?') ? '&' : '?';
            script.src = `${url}${sep}alt=json-in-script&callback=${callbackName}`;
            
            script.onerror = function() {
                delete window[callbackName];
                if (script.parentNode) document.body.removeChild(script);
                reject(new Error("Lỗi tải script feed"));
            };

            document.body.appendChild(script);
        });
    }

    // Tính dHash 256-bit (16x16) trên HTML5 Canvas
    function computeDHash256(imgElement) {
        const canvas = document.createElement('canvas');
        canvas.width = 17;
        canvas.height = 16;
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(imgElement, 0, 0, 17, 16);
        const imgData = ctx.getImageData(0, 0, 17, 16).data;
        
        let grayscale = [];
        for (let i = 0; i < imgData.length; i += 4) {
            let r = imgData[i], g = imgData[i+1], b = imgData[i+2], a = imgData[i+3] / 255;
            let gray = (r * 0.299 + g * 0.587 + b * 0.114) * a + 255 * (1 - a);
            grayscale.push(gray);
        }

        let hash = "";
        for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
                let pLeft = grayscale[y * 17 + x];
                let pRight = grayscale[y * 17 + x + 1];
                hash += (pLeft > pRight) ? "1" : "0";
            }
        }
        return hash;
    }

    function loadImageAndHash(imgUrl) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            
            img.onload = () => {
                try {
                    const hash = computeDHash256(img);
                    resolve(hash);
                } catch (e) {
                    tryWithProxy(imgUrl).then(resolve);
                }
            };
            
            img.onerror = () => {
                tryWithProxy(imgUrl).then(resolve);
            };
            
            img.src = imgUrl;
        });
    }

    function tryWithProxy(imgUrl) {
        return new Promise((resolve) => {
            const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(imgUrl);
            const img = new Image();
            img.crossOrigin = "Anonymous";
            
            img.onload = () => {
                try {
                    const hash = computeDHash256(img);
                    resolve(hash);
                } catch (e) {
                    resolve(null);
                }
            };
            
            img.onerror = () => resolve(null);
            img.src = proxyUrl;
        });
    }

    async function startProcessing() {
        document.getElementById('startBtn').disabled = true;
        log("🔄 Đang kết nối tới Blogger qua JSONP (Bypassing CORS)...");
        
        let start = 1;
        let max = 150;
        let entries = [];

        while (true) {
            let feedUrl = `${BLOG_URL}/feeds/posts/default?max-results=${max}&start-index=${start}`;
            try {
                let data = await fetchFeedJSONP(feedUrl);
                let pageEntries = data.feed ? (data.feed.entry || []) : [];
                if (pageEntries.length === 0) break;
                
                entries.push(...pageEntries);
                let total = parseInt(data.feed.openSearch$totalResults ? data.feed.openSearch$totalResults.$t : 0);
                log(`📥 Đã nạp thành công ${entries.length}/${total} bài viết...`);
                
                if (start + max > total) break;
                start += max;
            } catch (e) {
                log("❌ Lỗi đọc dữ liệu Feed qua JSONP!", "#ff6b6b");
                break;
            }
        }

        if (entries.length === 0) {
            log("⚠️ Không tìm thấy bài viết nào!", "#ff6b6b");
            document.getElementById('startBtn').disabled = false;
            return;
        }

        log(`<br>📸 Bắt đầu trích xuất mã dHash cho toàn bộ hình ảnh...`);

        let database = [];
        let count = 0;

        for (let entry of entries) {
            count++;
            let title = entry.title ? entry.title.$t : "Không tiêu đề";
            let postUrl = "";
            (entry.link || []).forEach(l => {
                if (l.rel === "alternate") postUrl = l.href;
            });

            if (!postUrl) continue;

            let htmlContent = (entry.content ? entry.content.$t : "") || (entry.summary ? entry.summary.$t : "");
            let div = document.createElement('div');
            div.innerHTML = htmlContent;
            let imgs = Array.from(div.querySelectorAll('img')).map(i => i.src).filter(src => src && src.startsWith('http'));

            if (imgs.length === 0 && entry.media$thumbnail) {
                let thumb = entry.media$thumbnail.url.replace(/\/(s\d+(-c)?|w\d+-h\d+[^/]*)\//, '/s500/');
                imgs.push(thumb);
            }

            imgs = [...new Set(imgs)];

            for (let imgUrl of imgs) {
                let cleanUrl = imgUrl.replace(/^http:/, 'https:');
                let hash = await loadImageAndHash(cleanUrl);
                
                if (hash) {
                    database.push({ t: title, u: postUrl, img: cleanUrl, h: hash });
                    log(`✅ [${count}/${entries.length}] ${title.substring(0, 35)}...`);
                } else {
                    log(`⚠️ Bỏ qua ảnh lỗi: ${cleanUrl.substring(0, 30)}...`, "#eccc68");
                }
            }
        }

        log(`<br>🎉 HOÀN THÀNH! Đã lưu dữ liệu cho ${database.length} hình ảnh.`, "#2ed573");
        
        // Tạo và tải file database.js về máy
        const jsonStr = JSON.stringify(database);
        const jsonEscaped = jsonStr.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\${/g, '\\${');
        const jsContent = `const blogDatabase = JSON.parse(\`${jsonEscaped}\`);\n`;

        const blob = new Blob([jsContent], { type: 'text/javascript' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'database.js';
        a.click();

        log("💾 File 'database.js' đã được tự động tải về máy!", "#2ed573");
        document.getElementById('startBtn').disabled = false;
    }
</script>

</body>
</html>
