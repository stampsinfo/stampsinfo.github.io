<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tách Dấu Mộc Đen Bưu Chính</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #f8f9fa;
      color: #212529;
    }
    h2 { text-align: center; color: #1a73e8; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #5f6368; font-size: 0.9em; margin-bottom: 20px; }
    
    .panel {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      align-items: end;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-size: 0.85em; font-weight: 600; }
    select, input, button {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.9em;
    }
    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .btn-reset { background-color: #6c757d; }
    .btn-reset:hover { background-color: #5a6268; }

    .preview-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .preview-box {
      flex: 1;
      min-width: 350px;
      text-align: center;
    }
    .canvas-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-image: linear-gradient(45deg, #eee 25%, transparent 25%), 
                        linear-gradient(-45deg, #eee 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #eee 75%), 
                        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .hint { font-size: 0.8em; color: #d93025; margin-top: 4px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Công Cụ Tách Dấu Đen Bưu Chính</h2>
  <p class="subtitle">Kéo chuột trên ảnh gốc để khoanh vùng con dấu cần lấy</p>

  <div class="panel">
    <div class="controls">
      <div class="control-group">
        <label for="upload">1. Chọn ảnh bì thư / tem:</label>
        <input type="file" id="upload" accept="image/*">
      </div>

      <div class="control-group">
        <label for="darkness">2. Độ đậm nét con dấu: <span id="darkVal">120</span></label>
        <input type="range" id="darkness" min="40" max="200" value="120">
      </div>

      <div class="control-group">
        <button id="resetCropBtn" class="btn-reset" disabled>Bỏ vùng khoanh (Lấy toàn bộ)</button>
      </div>

      <div class="control-group">
        <button id="downloadBtn" disabled>Tải ảnh con dấu PNG</button>
      </div>
    </div>
  </div>

  <div class="preview-container">
    <div class="preview-box">
      <h4>Ảnh gốc <span class="hint">(Nhấp & Kéo chuột để khoanh vùng dấu)</span></h4>
      <div class="canvas-wrapper">
        <canvas id="canvasInput"></canvas>
      </div>
    </div>
    <div class="preview-box">
      <h4>Kết quả tách riêng con dấu</h4>
      <canvas id="canvasOutput"></canvas>
    </div>
  </div>

  <script>
    const uploadInput = document.getElementById('upload');
    const darknessInput = document.getElementById('darkness');
    const darkVal = document.getElementById('darkVal');
    const resetCropBtn = document.getElementById('resetCropBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    const canvasIn = document.getElementById('canvasInput');
    const canvasOut = document.getElementById('canvasOutput');
    const ctxIn = canvasIn.getContext('2d', { willReadFrequently: true });
    const ctxOut = canvasOut.getContext('2d', { willReadFrequently: true });

    let imgElement = new Image();
    
    // Tọa độ vùng khoanh (ROI)
    let isDrawing = false;
    let startX = 0, startY = 0;
    let cropRect = null; // { x, y, w, h } theo kích thước thật của ảnh

    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        imgElement.onload = () => {
          canvasIn.width = imgElement.width;
          canvasIn.height = imgElement.height;
          canvasOut.width = imgElement.width;
          canvasOut.height = imgElement.height;

          cropRect = null;
          resetCropBtn.disabled = true;

          ctxIn.drawImage(imgElement, 0, 0);
          processImage();
          downloadBtn.disabled = false;
        };
        imgElement.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    darknessInput.addEventListener('input', () => {
      darkVal.innerText = darknessInput.value;
      processImage();
    });

    // --- XỬ LÝ KÉO CHUỘT KHOANH VÙNG (CROP ROI) ---
    function getCanvasCoordinates(e) {
      const rect = canvasIn.getBoundingClientRect();
      const scaleX = canvasIn.width / rect.width;
      const scaleY = canvasIn.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    canvasIn.addEventListener('mousedown', (e) => {
      if (!imgElement.src) return;
      isDrawing = true;
      const coords = getCanvasCoordinates(e);
      startX = coords.x;
      startY = coords.y;
    });

    canvasIn.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const coords = getCanvasCoordinates(e);
      const currentX = coords.x;
      const currentY = coords.y;

      // Vẽ lại ảnh gốc và khung hình chữ nhật chọn
      ctxIn.drawImage(imgElement, 0, 0);
      ctxIn.strokeStyle = '#d93025';
      ctxIn.lineWidth = Math.max(2, canvasIn.width / 300);
      ctxIn.setLineDash([6, 6]);
      ctxIn.strokeRect(startX, startY, currentX - startX, currentY - startY);
    });

    canvasIn.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const coords = getCanvasCoordinates(e);

      let x = Math.min(startX, coords.x);
      let y = Math.min(startY, coords.y);
      let w = Math.abs(coords.x - startX);
      let h = Math.abs(coords.y - startY);

      // Nếu vùng chọn đủ lớn mới tính là khoanh vùng
      if (w > 10 && h > 10) {
        cropRect = { x, y, w, h };
        resetCropBtn.disabled = false;
      } else {
        cropRect = null;
      }

      ctxIn.drawImage(imgElement, 0, 0);
      if (cropRect) {
        ctxIn.strokeStyle = '#1a73e8';
        ctxIn.lineWidth = Math.max(2, canvasIn.width / 300);
        ctxIn.setLineDash([]);
        ctxIn.strokeRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
      }
      processImage();
    });

    resetCropBtn.addEventListener('click', () => {
      cropRect = null;
      resetCropBtn.disabled = true;
      ctxIn.drawImage(imgElement, 0, 0);
      processImage();
    });

    // --- THUẬT TOÁN LỌC DẤU ĐEN ---
    function processImage() {
      if (!imgElement.src) return;

      const width = canvasIn.width;
      const height = canvasIn.height;
      const imgData = ctxIn.getImageData(0, 0, width, height);
      const data = imgData.data;

      const outImgData = ctxOut.createImageData(width, height);
      const outData = outImgData.data;

      const maxDarkness = parseFloat(darknessInput.value);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;

          // Nếu có vùng khoanh, điểm nằm ngoài vùng khoanh sẽ bị bỏ qua
          if (cropRect) {
            if (x < cropRect.x || x > cropRect.x + cropRect.w ||
                y < cropRect.y || y > cropRect.y + cropRect.h) {
              outData[i + 3] = 0; // Trong suốt
              continue;
            }
          }

          let r = data[i];
          let g = data[i + 1];
          let b = data[i + 2];

          // 1. Độ sáng trung bình
          let brightness = (r + g + b) / 3;

          // 2. Kiểm tra độ lệch màu để loại bỏ màu đỏ/nâu của hình vẽ và tem màu
          let colorDiff = Math.max(Math.abs(r - g), Math.abs(r - b), Math.abs(g - b));

          // Điều kiện nhận diện mực con dấu màu đen/xám:
          // - Độ sáng phải tối (brightness < maxDarkness)
          // - Màu sắc phải trung tính/xám/đen (colorDiff thấp) hoặc màu mực đen pha sắc xanh nhẹ
          let isBlackInk = (brightness < maxDarkness) && (colorDiff < 45 || (b > r && b > g && brightness < maxDarkness * 0.9));

          // Loại bỏ riêng nét mực đỏ của hình vẽ bên trái (R cao hơn hẳn G và B)
          if (r > g + 25 && r > b + 25) {
            isBlackInk = false;
          }

          if (isBlackInk) {
            outData[i] = r;
            outData[i + 1] = g;
            outData[i + 2] = b;
            outData[i + 3] = 255; // Giữ lại
          } else {
            outData[i + 3] = 0;   // Xóa nền
          }
        }
      }

      ctxOut.putImageData(outImgData, 0, 0);
    }

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'con-dau-ha-noi.png';
      link.href = canvasOut.toDataURL('image/png');
      link.click();
    });
  </script>

</body>
</html>
