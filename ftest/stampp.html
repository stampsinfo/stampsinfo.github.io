<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tự Động Nhận Diện & Tách Mộc Bưu Chính</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #f8f9fa;
      color: #212529;
    }
    h2 { text-align: center; color: #1a73e8; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #5f6368; font-size: 0.9em; margin-bottom: 20px; }
    
    .panel {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      align-items: end;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-size: 0.85em; font-weight: 600; }
    select, input, button {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.9em;
    }
    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .btn-reset { background-color: #6c757d; }
    .btn-reset:hover { background-color: #5a6268; }

    .preview-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .preview-box {
      flex: 1;
      min-width: 350px;
      text-align: center;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-image: linear-gradient(45deg, #eee 25%, transparent 25%), 
                        linear-gradient(-45deg, #eee 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #eee 75%), 
                        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .hint { font-size: 0.8em; color: #d93025; font-weight: bold; }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }
    .checkbox-group input { width: auto; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Công Cụ Tự Động Định Hình & Tách Mộc Tròn</h2>
  <p class="subtitle">Tự động ép khung hình tròn/elip & Lọc đốm mộc nhiễu xung quanh</p>

  <div class="panel">
    <div class="controls">
      <div class="control-group">
        <label for="upload">1. Chọn ảnh FDC / Tem:</label>
        <input type="file" id="upload" accept="image/*">
      </div>

      <div class="control-group">
        <label for="darkness">2. Độ đậm mực đen: <span id="darkVal">120</span></label>
        <input type="range" id="darkness" min="30" max="180" value="120">
      </div>

      <div class="control-group">
        <label for="colorFilter">3. Kháng màu xung quanh: <span id="colorFilterVal">18</span></label>
        <input type="range" id="colorFilter" min="5" max="40" value="18">
      </div>

      <div class="control-group">
        <label>4. Tính năng tự động:</label>
        <div class="checkbox-group">
          <input type="checkbox" id="circleMask" checked>
          <label for="circleMask" style="font-weight:normal;">Mặt nạ Khung Tròn / Elip</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="removeNoise" checked>
          <label for="removeNoise" style="font-weight:normal;">Xóa đốm nhiễu nhỏ</label>
        </div>
      </div>

      <div class="control-group">
        <button id="downloadBtn" disabled>Tải ảnh con dấu PNG</button>
      </div>
    </div>
  </div>

  <div class="preview-container">
    <div class="preview-box">
      <h4>Ảnh gốc <span class="hint">(Khoanh sát viền con dấu)</span></h4>
      <canvas id="canvasInput"></canvas>
    </div>
    <div class="preview-box">
      <h4>Kết quả tự động định hình mộc</h4>
      <canvas id="canvasOutput"></canvas>
    </div>
  </div>

  <script>
    const uploadInput = document.getElementById('upload');
    const darknessInput = document.getElementById('darkness');
    const colorFilterInput = document.getElementById('colorFilter');
    const circleMaskCheck = document.getElementById('circleMask');
    const removeNoiseCheck = document.getElementById('removeNoise');
    const darkVal = document.getElementById('darkVal');
    const colorFilterVal = document.getElementById('colorFilterVal');
    const downloadBtn = document.getElementById('downloadBtn');

    const canvasIn = document.getElementById('canvasInput');
    const canvasOut = document.getElementById('canvasOutput');
    const ctxIn = canvasIn.getContext('2d', { willReadFrequently: true });
    const ctxOut = canvasOut.getContext('2d', { willReadFrequently: true });

    let imgElement = new Image();
    let isDrawing = false;
    let startX = 0, startY = 0;
    let cropRect = null;

    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        imgElement.onload = () => {
          canvasIn.width = imgElement.width;
          canvasIn.height = imgElement.height;
          canvasOut.width = imgElement.width;
          canvasOut.height = imgElement.height;

          cropRect = null;
          ctxIn.drawImage(imgElement, 0, 0);
          processImage();
          downloadBtn.disabled = false;
        };
        imgElement.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    darknessInput.addEventListener('input', () => { darkVal.innerText = darknessInput.value; processImage(); });
    colorFilterInput.addEventListener('input', () => { colorFilterVal.innerText = colorFilterInput.value; processImage(); });
    circleMaskCheck.addEventListener('change', processImage);
    removeNoiseCheck.addEventListener('change', processImage);

    // --- KHOANH VÙNG (ROI) ---
    function getCanvasCoordinates(e) {
      const rect = canvasIn.getBoundingClientRect();
      const scaleX = canvasIn.width / rect.width;
      const scaleY = canvasIn.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    canvasIn.addEventListener('mousedown', (e) => {
      if (!imgElement.src) return;
      isDrawing = true;
      const coords = getCanvasCoordinates(e);
      startX = coords.x;
      startY = coords.y;
    });

    canvasIn.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const coords = getCanvasCoordinates(e);
      ctxIn.drawImage(imgElement, 0, 0);
      ctxIn.strokeStyle = '#d93025';
      ctxIn.lineWidth = Math.max(2, canvasIn.width / 300);
      ctxIn.setLineDash([6, 6]);
      
      let w = coords.x - startX;
      let h = coords.y - startY;

      if (circleMaskCheck.checked) {
        // Vẽ khung elip xem trước
        ctxIn.beginPath();
        ctxIn.ellipse(startX + w/2, startY + h/2, Math.abs(w/2), Math.abs(h/2), 0, 0, 2 * Math.PI);
        ctxIn.stroke();
      } else {
        ctxIn.strokeRect(startX, startY, w, h);
      }
    });

    canvasIn.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const coords = getCanvasCoordinates(e);

      let x = Math.min(startX, coords.x);
      let y = Math.min(startY, coords.y);
      let w = Math.abs(coords.x - startX);
      let h = Math.abs(coords.y - startY);

      if (w > 10 && h > 10) {
        cropRect = { x, y, w, h };
      } else {
        cropRect = null;
      }

      ctxIn.drawImage(imgElement, 0, 0);
      if (cropRect) {
        ctxIn.strokeStyle = '#1a73e8';
        ctxIn.lineWidth = Math.max(2, canvasIn.width / 300);
        ctxIn.setLineDash([]);
        
        if (circleMaskCheck.checked) {
          ctxIn.beginPath();
          ctxIn.ellipse(cropRect.x + cropRect.w/2, cropRect.y + cropRect.h/2, cropRect.w/2, cropRect.h/2, 0, 0, 2 * Math.PI);
          ctxIn.stroke();
        } else {
          ctxIn.strokeRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
        }
      }
      processImage();
    });

    // --- THUẬT TOÁN TỰ ĐỘNG XÁC ĐỊNH MỘC & LỌC NHIỄU ---
    function processImage() {
      if (!imgElement.src) return;

      const width = canvasIn.width;
      const height = canvasIn.height;
      const imgData = ctxIn.getImageData(0, 0, width, height);
      const data = imgData.data;

      const outImgData = ctxOut.createImageData(width, height);
      const outData = outImgData.data;

      const maxDarkness = parseFloat(darknessInput.value);
      const maxColorDiff = parseFloat(colorFilterInput.value);
      const useCircleMask = circleMaskCheck.checked;
      const useNoiseFilter = removeNoiseCheck.checked;

      // Tính thông số khung Elip nếu có khoanh vùng
      let cx = 0, cy = 0, rx = 0, ry = 0;
      if (cropRect) {
        cx = cropRect.x + cropRect.w / 2;
        cy = cropRect.y + cropRect.h / 2;
        rx = cropRect.w / 2;
        ry = cropRect.h / 2;
      }

      // Mảng lưu trạng thái pixel mộc để lọc đốm nhiễu (0: Nền, 1: Mộc)
      let mask = new Uint8Array(width * height);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = y * width + x;
          const i = idx * 4;

          // 1. Kiểm tra phạm vi khoanh vùng
          if (cropRect) {
            if (x < cropRect.x || x > cropRect.x + cropRect.w || y < cropRect.y || y > cropRect.y + cropRect.h) {
              continue;
            }

            // 2. TỰ ĐỘNG ÉP PHẠM VI KHUNG TRÒN / ELIP
            if (useCircleMask) {
              let dx = (x - cx) / rx;
              let dy = (y - cy) / ry;
              if ((dx * dx + dy * dy) > 1.0) { 
                continue; // Nằm ngoài vòng tròn mộc -> XÓA TỰ ĐỘNG
              }
            }
          }

          let r = data[i];
          let g = data[i + 1];
          let b = data[i + 2];

          let brightness = (r + g + b) / 3;
          let maxDiff = Math.max(Math.abs(r - g), Math.abs(r - b), Math.abs(g - b));

          // 3. Điều kiện nhận diện mực đen
          if (brightness < maxDarkness && maxDiff <= maxColorDiff) {
            mask[idx] = 1;
            outData[i] = r;
            outData[i + 1] = g;
            outData[i + 2] = b;
            outData[i + 3] = 255;
          }
        }
      }

      // 4. THUẬT TOÁN XÓA ĐỐM NHIỄU LẺ TẺ (Blob Filter)
      if (useNoiseFilter && cropRect) {
        let visited = new Uint8Array(width * height);
        let minBlobSize = 12; // Các cụm hạt dưới 12 pixel sẽ bị xóa tự động

        for (let y = cropRect.y; y < cropRect.y + cropRect.h; y++) {
          for (let x = cropRect.x; x < cropRect.x + cropRect.w; x++) {
            let idx = Math.floor(y) * width + Math.floor(x);
            if (mask[idx] === 1 && visited[idx] === 0) {
              // BFS tìm cụm pixel liên thông
              let queue = [idx];
              let blob = [idx];
              visited[idx] = 1;

              let head = 0;
              while(head < queue.length) {
                let curr = queue[head++];
                let cx = curr % width;
                let cy = Math.floor(curr / width);

                let neighbors = [
                  curr - 1, curr + 1, curr - width, curr + width
                ];

                for (let n of neighbors) {
                  if (n >= 0 && n < mask.length && mask[n] === 1 && visited[n] === 0) {
                    visited[n] = 1;
                    queue.push(n);
                    blob.push(n);
                  }
                }
              }

              // Nếu cụm quá nhỏ (nhiễu/đốm dơ) -> Tự động xóa
              if (blob.length < minBlobSize) {
                for (let pixelIdx of blob) {
                  outData[pixelIdx * 4 + 3] = 0;
                }
              }
            }
          }
        }
      }

      ctxOut.putImageData(outImgData, 0, 0);
    }

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'moc-tron-da-loc-sach.png';
      link.href = canvasOut.toDataURL('image/png');
      link.click();
    });
  </script>

</body>
</html>
