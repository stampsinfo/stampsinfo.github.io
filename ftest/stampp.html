<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tách Mộc Bưu Chính Chuyên Nghiệp - Bóc Nền Tem</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #f8f9fa;
      color: #212529;
    }
    h2 { text-align: center; color: #1a73e8; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #5f6368; font-size: 0.9em; margin-bottom: 20px; }
    
    .panel {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      align-items: end;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-size: 0.85em; font-weight: 600; }
    select, input, button {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.9em;
    }
    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    
    .preview-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .preview-box {
      flex: 1;
      min-width: 350px;
      text-align: center;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-image: linear-gradient(45deg, #eee 25%, transparent 25%), 
                        linear-gradient(-45deg, #eee 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #eee 75%), 
                        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .hint { font-size: 0.8em; color: #d93025; font-weight: bold; }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h2>Công Cụ Tách Mộc Bưu Chính Thuần JS - Chống Mất Nét Trên Tem</h2>
  <p class="subtitle">Sử dụng thuật toán Phân tích tương phản cục bộ (Local Contrast Subtraction)</p>

  <div class="panel">
    <div class="controls">
      <div class="control-group">
        <label for="upload">1. Chọn ảnh FDC / Bì Thư:</label>
        <input type="file" id="upload" accept="image/*">
      </div>

      <div class="control-group">
        <label for="sensitivity">2. Độ nhạy bắt nét mộc: <span id="sensVal">25</span></label>
        <input type="range" id="sensitivity" min="10" max="60" value="25">
      </div>

      <div class="control-group">
        <label for="colorTolerance">3. Kháng màu tem (Xanh/Cam/Đỏ): <span id="colorTolVal">20</span></label>
        <input type="range" id="colorTolerance" min="5" max="50" value="20">
      </div>

      <div class="control-group">
        <label>4. Chế độ định hình:</label>
        <div class="checkbox-group">
          <input type="checkbox" id="circleMask" checked>
          <label for="circleMask">Cắt khung tròn / elip</label>
        </div>
      </div>

      <div class="control-group">
        <button id="downloadBtn" disabled>Tải ảnh PNG Nền Suốt</button>
      </div>
    </div>
  </div>

  <div class="preview-container">
    <div class="preview-box">
      <h4>Ảnh gốc <span class="hint">(Kéo chuột khoanh sát mộc)</span></h4>
      <canvas id="canvasInput"></canvas>
    </div>
    <div class="preview-box">
      <h4>Kết quả bóc mộc nguyên vẹn</h4>
      <canvas id="canvasOutput"></canvas>
    </div>
  </div>

  <script>
    const uploadInput = document.getElementById('upload');
    const sensitivityInput = document.getElementById('sensitivity');
    const colorTolInput = document.getElementById('colorTolerance');
    const circleMaskCheck = document.getElementById('circleMask');
    const sensVal = document.getElementById('sensVal');
    const colorTolVal = document.getElementById('colorTolVal');
    const downloadBtn = document.getElementById('downloadBtn');

    const canvasIn = document.getElementById('canvasInput');
    const canvasOut = document.getElementById('canvasOutput');
    const ctxIn = canvasIn.getContext('2d', { willReadFrequently: true });
    const ctxOut = canvasOut.getContext('2d', { willReadFrequently: true });

    let imgElement = new Image();
    let isDrawing = false;
    let startX = 0, startY = 0;
    let cropRect = null;

    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        imgElement.onload = () => {
          canvasIn.width = imgElement.width;
          canvasIn.height = imgElement.height;
          canvasOut.width = imgElement.width;
          canvasOut.height = imgElement.height;

          cropRect = null;
          ctxIn.drawImage(imgElement, 0, 0);
          processImage();
          downloadBtn.disabled = false;
        };
        imgElement.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    sensitivityInput.addEventListener('input', () => { sensVal.innerText = sensitivityInput.value; processImage(); });
    colorTolInput.addEventListener('input', () => { colorTolVal.innerText = colorTolInput.value; processImage(); });
    circleMaskCheck.addEventListener('change', processImage);

    // --- KHOANH VÙNG ROI ---
    function getCanvasCoordinates(e) {
      const rect = canvasIn.getBoundingClientRect();
      const scaleX = canvasIn.width / rect.width;
      const scaleY = canvasIn.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    canvasIn.addEventListener('mousedown', (e) => {
      if (!imgElement.src) return;
      isDrawing = true;
      const coords = getCanvasCoordinates(e);
      startX = coords.x;
      startY = coords.y;
    });

    canvasIn.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const coords = getCanvasCoordinates(e);
      ctxIn.drawImage(imgElement, 0, 0);
      ctxIn.strokeStyle = '#d93025';
      ctxIn.lineWidth = Math.max(2, canvasIn.width / 300);
      ctxIn.setLineDash([6, 6]);
      
      let w = coords.x - startX;
      let h = coords.y - startY;

      if (circleMaskCheck.checked) {
        ctxIn.beginPath();
        ctxIn.ellipse(startX + w/2, startY + h/2, Math.abs(w/2), Math.abs(h/2), 0, 0, 2 * Math.PI);
        ctxIn.stroke();
      } else {
        ctxIn.strokeRect(startX, startY, w, h);
      }
    });

    canvasIn.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const coords = getCanvasCoordinates(e);

      let x = Math.min(startX, coords.x);
      let y = Math.min(startY, coords.y);
      let w = Math.abs(coords.x - startX);
      let h = Math.abs(coords.y - startY);

      if (w > 10 && h > 10) {
        cropRect = { x, y, w, h };
      } else {
        cropRect = null;
      }

      ctxIn.drawImage(imgElement, 0, 0);
      if (cropRect) {
        ctxIn.strokeStyle = '#1a73e8';
        ctxIn.lineWidth = Math.max(2, canvasIn.width / 300);
        ctxIn.setLineDash([]);
        
        if (circleMaskCheck.checked) {
          ctxIn.beginPath();
          ctxIn.ellipse(cropRect.x + cropRect.w/2, cropRect.y + cropRect.h/2, cropRect.w/2, cropRect.h/2, 0, 0, 2 * Math.PI);
          ctxIn.stroke();
        } else {
          ctxIn.strokeRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);
        }
      }
      processImage();
    });

    // --- THUẬT TOÁN BÓC MỘC TRÊN NỀN TEM (LOCAL CONTRAST DILATION) ---
    function processImage() {
      if (!imgElement.src) return;

      const width = canvasIn.width;
      const height = canvasIn.height;
      const imgData = ctxIn.getImageData(0, 0, width, height);
      const data = imgData.data;

      const outImgData = ctxOut.createImageData(width, height);
      const outData = outImgData.data;

      const sens = parseFloat(sensitivityInput.value);
      const colorTol = parseFloat(colorTolInput.value);
      const useCircleMask = circleMaskCheck.checked;

      // Bước 1: Tạo bản đồ độ xám (Grayscale)
      const gray = new Float32Array(width * height);
      for (let i = 0; i < data.length; i += 4) {
        gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      }

      // Bước 2: Tạo bản đồ nền cục bộ bằng thuật toán Max-Filter (Morphological Dilation)
      // Giúp ước lượng độ sáng của nền ngay xung quanh từng pixel
      const bgMap = new Float32Array(width * height);
      const radius = 6; // Bán kính quét nền xung quanh

      let cx = 0, cy = 0, rx = 0, ry = 0;
      if (cropRect) {
        cx = cropRect.x + cropRect.w / 2;
        cy = cropRect.y + cropRect.h / 2;
        rx = cropRect.w / 2;
        ry = cropRect.h / 2;
      }

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = y * width + x;

          // Bỏ qua pixel ngoài vùng khoanh
          if (cropRect) {
            if (x < cropRect.x || x > cropRect.x + cropRect.w || y < cropRect.y || y > cropRect.y + cropRect.h) continue;
            if (useCircleMask) {
              let dx = (x - cx) / rx;
              let dy = (y - cy) / ry;
              if ((dx * dx + dy * dy) > 1.0) continue;
            }
          }

          // Tìm giá trị độ sáng lớn nhất (nền sáng nhất) trong bán kính lân cận
          let maxVal = gray[idx];
          for (let dy = -radius; dy <= radius; dy += 3) {
            let ny = y + dy;
            if (ny < 0 || ny >= height) continue;
            for (let dx = -radius; dx <= radius; dx += 3) {
              let nx = x + dx;
              if (nx < 0 || nx >= width) continue;
              let nVal = gray[ny * width + nx];
              if (nVal > maxVal) maxVal = nVal;
            }
          }
          bgMap[idx] = maxVal;
        }
      }

      // Bước 3: Lọc lấy nét mộc dựa trên độ tương phản cục bộ & Loại trừ sắc màu tem
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = y * width + x;
          const i = idx * 4;

          if (bgMap[idx] === 0) continue;

          let r = data[i];
          let g = data[i + 1];
          let b = data[i + 2];

          // Độ chênh lệch giữa nền xung quanh và điểm hiện tại
          let diff = bgMap[idx] - gray[idx];

          // Kiểm tra độ trung tính màu (Mực dấu là đen/xám nên R,G,B tương đương nhau)
          let maxColorDiff = Math.max(Math.abs(r - g), Math.abs(r - b), Math.abs(g - b));

          // ĐIỀU KIỆN LỌC NÂNG CAO:
          // 1. Điểm đó phải tối hơn nền xung quanh ít nhất 'sens' đơn vị (Tự thích nghi theo màu tem)
          // 2. Điểm đó không được mang màu sắc đậm của tem (maxColorDiff <= colorTol)
          if (diff > sens && maxColorDiff <= colorTol) {
            // Giữ lại nét mực đen thật
            outData[i] = r;
            outData[i + 1] = g;
            outData[i + 2] = b;
            outData[i + 3] = 255;
          } else {
            // Xóa nền tem cam, tem xanh, nền thư
            outData[i + 3] = 0;
          }
        }
      }

      ctxOut.putImageData(outImgData, 0, 0);
    }

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'boc-moc-chuyen-nghiep.png';
      link.href = canvasOut.toDataURL('image/png');
      link.click();
    });
  </script>

</body>
</html>
