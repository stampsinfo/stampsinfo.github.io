<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Công Cụ Tách Dấu Mộc Phức Tạp (Thuần JS)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #f8f9fa;
      color: #212529;
    }
    h2 { text-align: center; color: #1a73e8; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #5f6368; font-size: 0.9em; margin-bottom: 20px; }
    
    .panel {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      align-items: end;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-size: 0.85em; font-weight: 600; }
    select, input, button {
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.9em;
    }
    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    
    .preview-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .preview-box {
      flex: 1;
      min-width: 300px;
      text-align: center;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-image: linear-gradient(45deg, #eee 25%, transparent 25%), 
                        linear-gradient(-45deg, #eee 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #eee 75%), 
                        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
  </style>
</head>
<body>

  <h2>Công Cụ Tách Dấu Mộc Bưu Chính & Dấu Phức Tạp</h2>
  <p class="subtitle">Tự động tách nền trong suốt • Hoạt động 100% Offline • Không phụ thuộc thư viện ngoài</p>

  <div class="panel">
    <div class="controls">
      <div class="control-group">
        <label for="upload">1. Chọn ảnh con dấu:</label>
        <input type="file" id="upload" accept="image/*">
      </div>

      <div class="control-group">
        <label for="stampMode">2. Chế độ xử lý:</label>
        <select id="stampMode">
          <option value="red_hsv">Dấu Đỏ / Bưu Chính (Lọc HSV)</option>
          <option value="blue_hsv">Dấu Xanh (Con dấu tròn / Chữ ký)</option>
          <option value="adaptive">Dấu Đen / Tối màu (Tự động thích nghi)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="threshold">3. Độ nhạy lọc (Threshold): <span id="threshVal">40</span></label>
        <input type="range" id="threshold" min="10" max="100" value="40">
      </div>

      <div class="control-group">
        <button id="downloadBtn" disabled>Tải ảnh PNG Nền Trong Suốt</button>
      </div>
    </div>
  </div>

  <div class="preview-container">
    <div class="preview-box">
      <h4>Ảnh gốc</h4>
      <canvas id="canvasInput"></canvas>
    </div>
    <div class="preview-box">
      <h4>Kết quả tách tự động</h4>
      <canvas id="canvasOutput"></canvas>
    </div>
  </div>

  <script>
    const uploadInput = document.getElementById('upload');
    const stampModeSelect = document.getElementById('stampMode');
    const thresholdInput = document.getElementById('threshold');
    const threshVal = document.getElementById('threshVal');
    const downloadBtn = document.getElementById('downloadBtn');

    const canvasIn = document.getElementById('canvasInput');
    const canvasOut = document.getElementById('canvasOutput');
    const ctxIn = canvasIn.getContext('2d', { willReadFrequently: true });
    const ctxOut = canvasOut.getContext('2d', { willReadFrequently: true });

    let imgElement = new Image();

    // Chuyển RGB sang HSV
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max;
      let d = max - min;
      s = max === 0 ? 0 : d / max;

      if (max === min) {
        h = 0;
      } else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s * 100, v * 100];
    }

    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        imgElement.onload = () => {
          canvasIn.width = imgElement.width;
          canvasIn.height = imgElement.height;
          canvasOut.width = imgElement.width;
          canvasOut.height = imgElement.height;

          ctxIn.drawImage(imgElement, 0, 0);
          processImage();
          downloadBtn.disabled = false;
        };
        imgElement.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    thresholdInput.addEventListener('input', () => {
      threshVal.innerText = thresholdInput.value;
      processImage();
    });

    stampModeSelect.addEventListener('change', processImage);

    function processImage() {
      if (!imgElement.src) return;

      const width = canvasIn.width;
      const height = canvasIn.height;
      const imgData = ctxIn.getImageData(0, 0, width, height);
      const data = imgData.data;

      const outImgData = ctxOut.createImageData(width, height);
      const outData = outImgData.data;

      const mode = stampModeSelect.value;
      const sensitivity = parseFloat(thresholdInput.value);

      for (let i = 0; i < data.length; i += 4) {
        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];
        let isStamp = false;

        if (mode === 'red_hsv') {
          // Lọc sắc độ màu đỏ trong không gian HSV
          let [h, s, v] = rgbToHsv(r, g, b);
          let isRedHue = (h <= 25 || h >= 330);
          if (isRedHue && s >= sensitivity && v >= 20) {
            isStamp = true;
          }
        } else if (mode === 'blue_hsv') {
          // Lọc sắc độ màu xanh
          let [h, s, v] = rgbToHsv(r, g, b);
          let isBlueHue = (h >= 170 && h <= 260);
          if (isBlueHue && s >= sensitivity && v >= 20) {
            isStamp = true;
          }
        } else if (mode === 'adaptive') {
          // Phân ngưỡng độ sáng tối thích nghi
          let gray = 0.299 * r + 0.587 * g + 0.114 * b;
          if (gray < (255 - sensitivity * 1.8)) {
            isStamp = true;
          }
        }

        if (isStamp) {
          outData[i] = r;
          outData[i + 1] = g;
          outData[i + 2] = b;
          outData[i + 3] = 255; // Giữ lại nét mộc
        } else {
          outData[i + 3] = 0;   // Xóa nền thành trong suốt
        }
      }

      ctxOut.putImageData(outImgData, 0, 0);
    }

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'dau-moc-tach-nen.png';
      link.href = canvasOut.toDataURL('image/png');
      link.click();
    });
  </script>

</body>
</html>
