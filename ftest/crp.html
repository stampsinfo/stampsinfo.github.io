<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <style>
        /* YÊU CẦU 1: Ẩn khu vực cấu hình kết nối */
        #cau-hinh-api {
            display: none;
        }
        
        /* Hỗ trợ cuộn trang mượt mà */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>

    <!-- YÊU CẦU 2: Đưa phần Nhập Bài Viết Cũ lên đầu tiên -->
    <div id="nhap-bai-cu">
        <button onclick="toggleBaiCu()">Nhập Bài Viết Cũ (Tự động điền thông tin) - Bấm để đóng/mở</button>
        <div id="noi-dung-bai-cu" style="display:none;">
            <!-- Nội dung nhập thông tin bài cũ -->
        </div>
    </div>

    <!-- Nút đăng nhập được đặt ngay sau phần Nhập bài cũ -->
    <button id="btn-dang-nhap-google">Đăng nhập Google</button>

    <!-- Khu vực cấu hình đã bị CSS ẩn đi -->
    <div id="cau-hinh-api">
        <h3>Cấu hình kết nối Blogger API v3</h3>
        <!-- Dùng type="hidden" nếu JS của bạn bắt buộc phải có thẻ input này để chạy -->
        <input type="hidden" id="client-id" value="ID_CUA_BAN">
        <input type="hidden" id="client-secret" value="SECRET_CUA_BAN">
    </div>

    <!-- Khoảng trống giả lập để thấy hiệu ứng cuộn trang -->
    <div style="height: 800px;"></div>

    <!-- YÊU CẦU 3: Form đăng bài cần tự động cuộn tới -->
    <div id="form-dang-bai">
        <h3>Form Đăng Bài Trực Tiếp</h3>
        <!-- Các trường nhập tiêu đề, nội dung... -->
    </div>

    <script>
        // Hàm xử lý đóng/mở phần nhập bài cũ
        function toggleBaiCu() {
            var content = document.getElementById("noi-dung-bai-cu");
            if (content.style.display === "none") {
                content.style.display = "block";
            } else {
                content.style.display = "none";
            }
        }

        // Kịch bản tự động cuộn xuống form khi tải trang xong
        window.addEventListener('DOMContentLoaded', (event) => {
            const formElement = document.getElementById('form-dang-bai');
            if (formElement) {
                // Sử dụng setTimeout (ví dụ 500ms) để đảm bảo toàn bộ giao diện đã render xong trước khi cuộn
                setTimeout(() => {
                    formElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 500);
            }
        });
    </script>
</body>
</html>
