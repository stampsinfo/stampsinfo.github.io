<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Công cụ kiểm tra bài viết Blogger - Stamp.io.vn</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; max-width: 800px; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #6c757d; }
        #status { font-weight: bold; margin: 15px 0; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>Kiểm tra lỗi bài viết Stamp.io.vn</h2>
    <p>Nhập API Key của Google để bắt đầu quét toàn bộ bài viết trên Blog ID: <code>562661508258286882</code></p>
    
    <label for="apiKey">Google API Key: </label>
    <input type="text" id="apiKey" placeholder="Dán Google API Key vào đây" style="width: 350px; padding: 8px;">
    <button id="startBtn" onclick="startScanning()">Bắt đầu quét</button>

    <div id="status">Trạng thái: Sẵn sàng</div>
    
    <h3>Kết quả phát hiện (<span id="count">0</span> bài lỗi):</h3>
    <table id="resultTable">
        <thead>
            <tr>
                <th>STT</th>
                <th>Tiêu đề bài viết</th>
                <th>Số thẻ &lt;img&gt;</th>
                <th>Liên kết</th>
            </tr>
        </thead>
        <tbody>
            <!-- Kết quả sẽ hiển thị ở đây -->
        </tbody>
    </table>
</div>

<script>
const BLOG_ID = '562661508258286882';

async function startScanning() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) {
        alert('Vui lòng nhập API Key để gọi Blogger API!');
        return;
    }

    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const tbody = document.querySelector('#resultTable tbody');
    const countSpan = document.getElementById('count');
    
    tbody.innerHTML = '';
    countSpan.textContent = '0';
    startBtn.disabled = true;

    let nextPageToken = '';
    let totalFetched = 0;
    let totalMatched = 0;

    try {
        do {
            status.textContent = `Đang tải bài viết... (Đã quét ${totalFetched} bài)`;
            
            let url = `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts?key=${apiKey}&maxResults=50&fetchBodies=true`;
            if (nextPageToken) {
                url += `&pageToken=${nextPageToken}`;
            }

            const response = await fetch(url);
            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || 'Lỗi kết nối API');
            }

            const data = await response.json();
            const posts = data.items || [];
            totalFetched += posts.length;

            // Xử lý kiểm tra bài viết
            posts.forEach(post => {
                const content = post.content || '';
                
                // 1. Kiểm tra có chứa chuỗi chỉ định không
                const hasTargetString = content.includes('<small>Số lượng</small><span>1 tem</span>');
                
                // 2. Đếm số lượng thẻ <img (không phân biệt chữ hoa/thường)
                const imgMatches = content.match(/<img\b/gi);
                const imgCount = imgMatches ? imgMatches.length : 0;

                // Điều kiện: Có chuỗi + Lớn hơn 1 thẻ <img>
                if (hasTargetString && imgCount > 1) {
                    totalMatched++;
                    countSpan.textContent = totalMatched;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${totalMatched}</td>
                        <td>${escapeHtml(post.title)}</td>
                        <td><b>${imgCount}</b> thẻ</td>
                        <td><a href="${post.url}" target="_blank">Xem bài viết</a></td>
                    `;
                    tbody.appendChild(row);
                }
            });

            nextPageToken = data.nextPageToken;

        } while (nextPageToken);

        status.textContent = `Hoàn tất! Đã quét tổng cộng ${totalFetched} bài viết. Tìm thấy ${totalMatched} bài vi phạm.`;

    } catch (error) {
        status.textContent = `Lỗi: ${error.message}`;
        alert(`Đã xảy ra lỗi: ${error.message}`);
    } finally {
        startBtn.disabled = false;
    }
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
</script>

</body>
</html>
