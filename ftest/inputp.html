<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Công cụ cập nhật bài viết theo nhóm nhãn VN & Số</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #1a73e8; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1557b0; }
        #log { background: #222; color: #0f0; padding: 15px; border-radius: 4px; height: 350px; overflow-y: auto; font-family: monospace; margin-top: 20px; font-size: 13px; }
        .config-box { margin-bottom: 15px; font-size: 14px; }
    </style>
    <!-- Thư viện Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>

<div class="container">
    <h2>Trình cập nhật nội dung bài viết theo nhóm nhãn (VN + Số)</h2>
    <div class="config-box">
        <p><strong>Blog ID:</strong> 562661508258286882</p>
        <p><strong>OAuth Client ID:</strong> 213657197881-pdt222eg02b8k404fa4ikrealtcdt71a.apps.googleusercontent.com</p>
    </div>
    <button id="authButton" onclick="handleAuthClick()">Đăng nhập & Bắt đầu quét</button>
    <div id="log">Nhấn nút trên để bắt đầu quá trình xác thực và xử lý...</div>
</div>

<script>
    const CLIENT_ID = '213657197881-pdt222eg02b8k404fa4ikrealtcdt71a.apps.googleusercontent.com';
    const BLOG_ID = '562661508258286882';
    const SCOPES = 'https://www.googleapis.com/auth/blogger';

    let tokenClient;
    let gapiInited = false;
    let gsiInited = false;

    function logMessage(message) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${message}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function gapiLoaded() {
        gapi.load('client', initializeGapiClient);
    }

    async function initializeGapiClient() {
        await gapi.client.init({
            discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/blogger/v3/rest'],
        });
        gapiInited = true;
        maybeEnableButton();
    }

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: '',
        });
        gsiInited = true;
        maybeEnableButton();
    }

    window.onload = function() {
        gapiLoaded();
        gisLoaded();
    };

    function maybeEnableButton() {
        if (gapiInited && gsiInited) {
            logMessage('Hệ thống sẵn sàng. Vui lòng bấm nút đăng nhập.');
        }
    }

    function handleAuthClick() {
        tokenClient.callback = async (resp) => {
            if (resp.error !== undefined) {
                throw (resp);
            }
            document.getElementById('authButton').style.display = 'none';
            logMessage('Đăng nhập thành công! Đang tải toàn bộ bài viết từ blog...');
            await processBlogPosts();
        };

        if (gapi.client.getToken() === null) {
            tokenClient.requestAccessToken({prompt: 'consent'});
        } else {
            tokenClient.requestAccessToken({prompt: ''});
        }
    }

    // Định dạng số nhãn theo yêu cầu:
    // 1 ký tự -> thêm 0 phía trước (ví dụ: 1 -> 01)
    // 2 ký tự -> thêm 0 phía trước (ví dụ: 11 -> 011)
    // Từ 3 ký tự trở lên -> giữ nguyên (ví dụ: 100 -> 100)
    function formatLabelNumber(numStr) {
        if (numStr.length === 1) return '0' + numStr;
        if (numStr.length === 2) return '0' + numStr;
        return numStr; 
    }

    async function processBlogPosts() {
        try {
            let pageToken = null;
            let allPosts = [];

            // Bước 1: Tải toàn bộ bài viết từ blog để tiến hành phân nhóm chính xác
            logMessage('Đang lấy danh sách bài viết...');
            do {
                let requestParams = {
                    blogId: BLOG_ID,
                    maxResults: 500,
                    fetchBodies: true
                };
                if (pageToken) requestParams.pageToken = pageToken;

                let response = await gapi.client.blogger.posts.list(requestParams);
                let posts = response.result.items;
                if (posts && posts.length > 0) {
                    allPosts = allPosts.concat(posts);
                }
                pageToken = response.result.nextPageToken;
            } while (pageToken);

            logMessage(`Đã tải tổng cộng ${allPosts.length} bài viết. Đang phân tích nhóm nhãn...`);

            // Bước 2: Gom nhóm bài viết theo key là nhãn số đã được chuẩn hóa (chỉ xét các bài có chứa đồng thời "VN" và nhãn số)
            let groups = {}; // Key: formattedNumber, Value: Array of posts

            for (let post of allPosts) {
                let labels = post.labels || [];
                let hasVN = labels.includes('VN');
                let numberLabel = labels.find(l => /^\d+$/.test(l));

                if (hasVN && numberLabel) {
                    let formattedNum = formatLabelNumber(numberLabel);
                    if (!groups[formattedNum]) {
                        groups[formattedNum] = [];
                    }
                    groups[formattedNum].push({
                        post: post,
                        originalNumberLabel: numberLabel
                    });
                }
            }

            let postsUpdated = 0;
            let groupsProcessed = 0;

            // Bước 3: Duyệt qua từng nhóm nhãn số
            for (let numKey in groups) {
                let groupList = groups[numKey];
                
                // Kiểm tra điều kiện: Nếu số lượng bài viết thuộc nhóm này >= 2 thì mới áp dụng
                if (groupList.length >= 2) {
                    groupsProcessed++;
                    logMessage(`Nhóm nhãn [VN + ${numKey}] có ${groupList.length} bài viết (Đạt điều kiện >= 2 bài). Tiến hành cập nhật...`);

                    for (let item of groupList) {
                        let post = item.post;
                        let content = post.content || '';
                        
                        // Nội dung chèn với đúng số thứ tự label số đã định dạng
                        let snippetToInsert = `<small>Tem cùng bộ</small><span><a href="/search/label/${numKey}" rel="nofollow">Xem thêm</a></span>`;
                        let targetPattern = /<small>Số lượng<\/small><span>[^<]*<\/span>/i;

                        // Kiểm tra xem bài viết có chứa vị trí cần chèn và chưa được chèn trước đó
                        if (targetPattern.test(content) && !content.includes(snippetToInsert)) {
                            let updatedContent = content.replace(targetPattern, (match) => {
                                return match + snippetToInsert;
                            });

                            // Gửi yêu cầu cập nhật: GIỮ NGUYÊN TIÊU ĐỀ (title) và GIỮ NGUYÊN NHÃN GỐC (labels)
                            let updateBody = {
                                id: post.id,
                                title: post.title,     // Bắt buộc giữ nguyên tiêu đề gốc
                                content: updatedContent,
                                labels: post.labels    // Giữ nguyên nhãn gốc hoàn toàn
                            };

                            await gapi.client.blogger.posts.update({
                                blogId: BLOG_ID,
                                postId: post.id,
                                resource: updateBody
                            });

                            postsUpdated++;
                            logMessage(`- Đã cập nhật bài: "${post.title}"`);
                        }
                    }
                } else {
                    logMessage(`Nhóm nhãn [VN + ${numKey}] chỉ có ${groupList.length} bài viết (Bỏ qua vì < 2 bài).`);
                }
            }

            logMessage(`Hoàn tất! Đã xử lý ${groupsProcessed} nhóm thỏa mãn điều kiện và cập nhật nội dung cho tổng số ${postsUpdated} bài viết. Tiêu đề và nhãn gốc được giữ nguyên hoàn toàn.`);

        } catch (err) {
            logMessage(`Lỗi xảy ra: ${err.message || JSON.stringify(err)}`);
            console.error(err);
        }
    }
</script>

</body>
</html>
