<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Cấu hình HTTP Headers chặn lưu cache trên trình duyệt -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Thông Báo Bảo Trì Hệ Thống</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .maintenance-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 24px;
        }

        .status-box {
            background-color: #f8f9fa;
            border-left: 4px solid #0066ff;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 13px;
            color: #444;
            text-align: left;
            margin-bottom: 24px;
        }

        .btn-clear {
            background-color: #0066ff;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-clear:hover {
            background-color: #0052cc;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="icon">🛠️</div>
        <h1>Hệ Thống Đang Bảo Trì</h1>
        <p>Chúng tôi đang nâng cấp hệ thống để cải thiện trải nghiệm của bạn. Vui lòng quay lại sau.</p>
        
        <div class="status-box" id="statusBox">
            Đang tiến hành dọn dẹp dữ liệu AI cũ trên thiết bị...
        </div>

        <button class="btn-clear" onclick="clearAllClientCache(true)" hidden>Xóa Cache & Tải Lại Trang</button>

        <div class="footer-note">Cảm ơn sự kiên nhẫn của bạn!</div>
    </div>

    <script>
        async function clearAllClientCache(userTriggered = false) {
            const statusBox = document.getElementById('statusBox');

            try {
                // 1. Xóa LocalStorage & SessionStorage
                localStorage.clear();
                sessionStorage.clear();

                // 2. Xóa Cookies
                const cookies = document.cookie.split("; ");
                for (let c of cookies) {
                    const [name] = c.split("=");
                    document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
                }

                // 3. Xóa Cache Storage (Service Worker Caches)
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(name => caches.delete(name)));
                }

                // 4. Hủy đăng ký Service Workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                }

                // 5. Xóa IndexedDB (Nếu có)
                if ('indexedDB' in window && indexedDB.databases) {
                    const dbs = await indexedDB.databases();
                    dbs.forEach(db => {
                        if (db.name) indexedDB.deleteDatabase(db.name);
                    });
                }

                if (userTriggered) {
                    statusBox.innerText = "Đã dọn dẹp hoàn tất! Đang tải lại...";
                    setTimeout(() => {
                        window.location.reload(true);
                    }, 1000);
                } else {
                    statusBox.innerText = "Đã tự động xóa dữ liệu AI cũ trên thiết bị.";
                }

            } catch (error) {
                console.error("Lỗi khi xóa cache:", error);
                statusBox.innerText = "Đã xóa hầu hết dữ liệu lưu trữ tạm thời.";
            }
        }

        // Tự động chạy khi người dùng truy cập vào trang bảo trì
        window.addEventListener('DOMContentLoaded', () => {
            clearAllClientCache(false);
        });
    </script>
</body>
</html>
