<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị Bảng điều khiển Vector CLIP - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen">
    <div class="max-w-5xl mx-auto p-4 sm:p-6">
        <header class="mb-6 border-b pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Trình quản trị Cache & Vector AI</h1>
                <p class="text-xs text-gray-500">Trích xuất Vector CLIP-ViT & Xuất tệp dữ liệu Cache</p>
            </div>
            <a href="./index.html" class="text-sm bg-gray-200 hover:bg-gray-300 font-semibold px-3 py-1.5 rounded-lg transition-all">
                ← Bảng Tìm Kiếm
            </a>
        </header>

        <!-- KHU VỰC ĐIỀU KHIỂN BẰNG NÚT -->
        <div class="bg-white p-5 rounded-xl shadow-sm border mb-6 space-y-4">
            <h2 class="text-md font-bold text-gray-800 border-b pb-2">Thao tác Quét & Xử lý</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <!-- NÚT QUÉT BLOG (Đã khắc phục lỗi con trỏ dấu chéo) -->
                <button id="btn-scan-blog" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95">
                    🔍 Quét Blog
                </button>

                <button id="btn-process-ai" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95">
                    🤖 Chạy Vector AI
                </button>

                <button id="btn-export-json" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95">
                    📄 Xuất update.json
                </button>

                <button id="btn-export-zip" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95">
                    📦 Xuất cache.zip
                </button>
            </div>
        </div>

        <!-- BẢNG THEO DÕI TRẠNG THÁI & LOG CHI TIẾT -->
        <div class="bg-white p-5 rounded-xl shadow-sm border mb-6">
            <div class="flex items-center justify-between border-b pb-3 mb-3">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <span id="status-spinner" class="w-3 h-3 rounded-full bg-blue-500 hidden animate-ping"></span>
                    Trạng thái Hệ thống
                </h3>
                <span id="stat-progress-text" class="text-xs font-semibold bg-gray-100 text-gray-700 px-2.5 py-1 rounded-full">Sẵn sàng</span>
            </div>

            <!-- Thanh tiến trình tổng -->
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4 overflow-hidden">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full w-0 transition-all duration-200"></div>
            </div>

            <!-- Khung Log Thời Gian Thực -->
            <div id="log-console" class="bg-gray-900 text-green-400 font-mono text-xs p-4 rounded-lg h-64 overflow-y-auto space-y-1.5 leading-relaxed border border-gray-800">
                <div class="text-gray-500">// Hệ thống sẵn sàng. Vui lòng bấm "Quét Blog" để bắt đầu...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { AutoProcessor, CLIPVisionModelWithProjection, RawImage, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js';

        env.allowLocalModels = false;
        const MODEL_ID = 'Xenova/clip-vit-base-patch32';
        
        let db = null;
        let processor = null;
        let model = null;

        const ui = {
            btnScan: document.getElementById('btn-scan-blog'),
            btnProcessAI: document.getElementById('btn-process-ai'),
            btnExportJson: document.getElementById('btn-export-json'),
            btnExportZip: document.getElementById('btn-export-zip'),
            logConsole: document.getElementById('log-console'),
            progressBar: document.getElementById('progress-bar'),
            progressText: document.getElementById('stat-progress-text'),
            spinner: document.getElementById('status-spinner')
        };

        function addLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let colorClass = 'text-green-400';
            if (type === 'warn') colorClass = 'text-yellow-400';
            if (type === 'error') colorClass = 'text-red-400';
            if (type === 'step') colorClass = 'text-cyan-300 font-bold';

            const logLine = document.createElement('div');
            logLine.className = colorClass;
            logLine.textContent = `[${time}] ${msg}`;
            ui.logConsole.appendChild(logLine);
            ui.logConsole.scrollTop = ui.logConsole.scrollHeight;
        }

        function setProgress(percent, text) {
            ui.progressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
            if (text) ui.progressText.textContent = text;
        }

        function setBusy(isBusy) {
            ui.spinner.classList.toggle('hidden', !isBusy);
            ui.btnScan.disabled = isBusy;
            ui.btnProcessAI.disabled = isBusy;
            ui.btnScan.classList.toggle('opacity-50', isBusy);
            ui.btnProcessAI.classList.toggle('opacity-50', isBusy);
        }

        async function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('BloggerImageSearchV2', 1);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('posts')) {
                        database.createObjectStore('posts', { keyPath: 'postId' });
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function dbGetAllPosts() {
            return new Promise((resolve) => {
                const tx = db.transaction('posts', 'readonly');
                const req = tx.objectStore('posts').getAll();
                req.onsuccess = () => resolve(req.result || []);
            });
        }

        function dbSavePost(post) {
            return new Promise((resolve) => {
                const tx = db.transaction('posts', 'readwrite');
                tx.objectStore('posts').put(post);
                tx.oncomplete = resolve;
            });
        }

        // --- 1. HÀM QUÉT BLOGGER VỚI BÁO CÁO TRẠNG THÁI CHI TIẾT ---
        async function handleScanBlog() {
            setBusy(true);
            setProgress(0, "Đang quét...");
            addLog("🚀 Bắt đầu quá trình quét danh sách bài viết từ Blogger Feed...", "step");

            try {
                let startIndex = 1;
                const maxResults = 50;
                let totalFetched = 0;
                let totalSaved = 0;
                let hasMore = true;

                while (hasMore) {
                    addLog(`🌐 Đang tải bài viết từ chỉ mục ${startIndex}...`);
                    const feedUrl = `/feeds/posts/default?alt=json&start-index=${startIndex}&max-results=${maxResults}`;
                    const res = await fetch(feedUrl);
                    if (!res.ok) throw new Error(`Lỗi kết nối Feed (Mã: ${res.status})`);
                    
                    const data = await res.json();
                    const entries = data.feed.entry || [];
                    
                    if (entries.length === 0) {
                        hasMore = false;
                        break;
                    }

                    for (const entry of entries) {
                        totalFetched++;
                        const postId = entry.id.$t.split('post-')[1] || entry.id.$t;
                        const title = entry.title.$t;
                        const linkObj = entry.link.find(l => l.rel === 'alternate');
                        const link = linkObj ? linkObj.href : '';
                        const content = entry.content ? entry.content.$t : '';

                        // Trích xuất hình ảnh từ nội dung HTML
                        const doc = new DOMParser().parseFromString(content, 'text/html');
                        const imgEls = Array.from(doc.querySelectorAll('img'));
                        const images = imgEls.map(img => ({
                            url: img.src,
                            stat: img.getAttribute('data-stat') || 'public'
                        })).filter(img => img.url && img.url.startsWith('http'));

                        const postRecord = {
                            postId,
                            title,
                            link,
                            rawImages: images,
                            embeddings: [] // Sẽ được sinh bởi AI
                        };

                        await dbSavePost(postRecord);
                        totalSaved++;
                        addLog(`  [Bài #${totalFetched}] ${title} (${images.length} ảnh)`);
                    }

                    startIndex += entries.length;
                    setProgress(30, `Đã quét ${totalFetched} bài`);
                    if (entries.length < maxResults) hasMore = false;
                }

                setProgress(100, "Hoàn tất quét");
                addLog(`✅ ĐÃ HOÀN THÀNH QUÉT BLOG! Tổng số bài tìm thấy: ${totalFetched}, Đã lưu vào DB: ${totalSaved}`, "step");
            } catch (err) {
                addLog(`❌ Quá trình quét thất bại: ${err.message}`, "error");
                setProgress(0, "Lỗi quét");
            } finally {
                setBusy(false);
            }
        }

        // --- 2. HÀM CHẠY VECTOR AI VỚI TRẠNG THÁI TIẾN TRÌNH ẢNH CHI TIẾT ---
        async function handleProcessAI() {
            setBusy(true);
            addLog("🤖 Đang khởi tạo mô hình AI CLIP-ViT...", "step");

            try {
                if (!processor || !model) {
                    processor = await AutoProcessor.from_pretrained(MODEL_ID);
                    model = await CLIPVisionModelWithProjection.from_pretrained(MODEL_ID);
                    addLog("✨ Đã tải mô hình AI vào bộ nhớ thành công!");
                }

                const posts = await dbGetAllPosts();
                if (posts.length === 0) {
                    addLog("⚠️ Không tìm thấy bài viết nào trong DB. Vui lòng bấm 'Quét Blog' trước!", "warn");
                    return;
                }

                addLog(`📊 Tổng số bài viết cần xử lý AI: ${posts.length}`, "step");
                let processedPosts = 0;

                for (let i = 0; i < posts.length; i++) {
                    const post = posts[i];
                    const rawImgs = post.rawImages || [];
                    processedPosts++;

                    addLog(`▶️ [Bài ${processedPosts}/${posts.length}] Đang xử lý: "${post.title}"`, "step");

                    if (rawImgs.length === 0) {
                        addLog(`  ⚠️ Bài viết không có hình ảnh. Bỏ qua.`, "warn");
                        continue;
                    }

                    post.embeddings = post.embeddings || [];
                    const existingUrls = new Set(post.embeddings.map(e => e.url));

                    let imgIndex = 0;
                    for (const imgItem of rawImgs) {
                        imgIndex++;
                        if (existingUrls.has(imgItem.url)) {
                            addLog(`  [Ảnh ${imgIndex}/${rawImgs.length}] ⏭️ Đã có Vector trong cache. Bỏ qua.`);
                            continue;
                        }

                        addLog(`  [Ảnh ${imgIndex}/${rawImgs.length}] 🖼️ Đang tải & phân tích Vector AI: ${imgItem.url}`);
                        try {
                            const rawImg = await RawImage.fromURL(imgItem.url);
                            const inputs = await processor(rawImg);
                            const { image_embeds } = await model(inputs);
                            const vectorArray = Array.from(image_embeds.data);

                            post.embeddings.push({
                                url: imgItem.url,
                                stat: imgItem.stat,
                                vector: vectorArray
                            });

                            await dbSavePost(post);
                            addLog(`  [Ảnh ${imgIndex}/${rawImgs.length}] ✅ Đã tạo Vector thành công!`);
                        } catch (imgErr) {
                            addLog(`  [Ảnh ${imgIndex}/${rawImgs.length}] ❌ Lỗi xử lý ảnh: ${imgErr.message}`, "error");
                        }
                    }

                    const overallProgress = Math.round((processedPosts / posts.length) * 100);
                    setProgress(overallProgress, `${overallProgress}% (${processedPosts}/${posts.length} bài)`);
                }

                setProgress(100, "Xử lý AI xong");
                addLog("🎉 HOÀN THÀNH TOÀN BỘ QUÁ TRÌNH TẠO VECTOR AI CHO CÁC BÀI VIẾT!", "step");
            } catch (err) {
                addLog(`❌ Quá trình chạy AI bị gián đoạn: ${err.message}`, "error");
            } finally {
                setBusy(false);
            }
        }

        // --- 3. XUẤT TỆP UPDATE.JSON ---
        async function handleExportJSON() {
            const posts = await dbGetAllPosts();
            if (posts.length === 0) return alert("Chưa có dữ liệu để xuất!");
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(posts, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "update.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            addLog("💾 Đã tải xuống tệp update.json!", "step");
        }

        // --- 4. XUẤT TỆP CACHE.ZIP ---
        async function handleExportZIP() {
            const posts = await dbGetAllPosts();
            if (posts.length === 0) return alert("Chưa có dữ liệu để đóng gói ZIP!");

            addLog("📦 Đang đóng gói dữ liệu vào cache.zip...", "step");
            const zip = new JSZip();
            zip.file("cache.json", JSON.stringify(posts));

            const blob = await zip.generateAsync({ type: "blob" });
            const dlAnchor = document.createElement('a');
            dlAnchor.href = URL.createObjectURL(blob);
            dlAnchor.download = "cache.zip";
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            addLog("📦 Đã đóng gói và tải xuống cache.zip thành công!", "step");
        }

        function setupEvents() {
            ui.btnScan.addEventListener('click', handleScanBlog);
            ui.btnProcessAI.addEventListener('click', handleProcessAI);
            ui.btnExportJson.addEventListener('click', handleExportJSON);
            ui.btnExportZip.addEventListener('click', handleExportZIP);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            setupEvents();
            addLog("Database IndexedDB đã khởi tạo sẵn sàng.");
        });
    </script>
</body>
</html>
