<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Dữ Liệu Cache Vector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md border">
        <h1 class="text-2xl font-bold mb-4 text-gray-900 border-b pb-2">Hệ Thống Quản Lý & Xuất Cache Vector</h1>
        
        <!-- Trạng thái AI -->
        <div id="status-panel" class="mb-4 p-4 bg-gray-50 rounded-lg border">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span id="model-badge" class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span id="model-status" class="text-sm font-medium">Đang khởi tạo mô hình AI...</span>
                </div>
                <span id="cache-count" class="text-xs bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-semibold">Data: 0 bài</span>
            </div>
            <div id="progress-bar-container" class="w-full bg-gray-200 rounded-full h-2 mt-3 hidden overflow-hidden">
                <div id="progress-bar" class="bg-blue-600 h-2 transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Bảng điều khiển -->
        <div class="space-y-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="url" id="blog-url" value="https://www.stamp.io.vn/" placeholder="https://tenblog.blogspot.com" class="flex-1 border rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <button id="btn-sync-blogger" disabled class="bg-gray-400 text-white px-5 py-2 rounded-lg text-sm font-semibold transition-all cursor-not-allowed flex items-center justify-center gap-2 shrink-0">
                    <svg class="w-4 h-4 animate-spin hidden" id="sync-spinner" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    🌐 Quét Dữ Liệu Mới (Blogger)
                </button>
            </div>

            <div class="flex flex-wrap gap-3 pt-3 border-t">
                <button id="btn-export-full-zip" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all">
                    📦 Xuất Toàn Bộ Cache (.ZIP)
                </button>
                <button id="btn-export-today-json" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all">
                    📄 Xuất Cập Nhật Hôm Nay (update.json)
                </button>
                <button id="btn-clear-cache" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-lg text-sm font-semibold transition-all ml-auto">
                    🗑️ Xóa Toàn Bộ Cache
                </button>
            </div>
        </div>

        <!-- Nhật ký Log -->
        <div id="sync-log-box" class="mt-6 p-4 bg-gray-900 text-green-400 rounded-lg text-xs font-mono h-48 overflow-y-auto custom-scrollbar">
            <div id="sync-log">> Hệ thống sẵn sàng.</div>
        </div>
    </div>

    <script type="module">
        import { AutoProcessor, CLIPVisionModelWithProjection, RawImage, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js';

        env.allowLocalModels = false;
        const MODEL_ID = 'Xenova/clip-vit-base-patch32';
        let processor = null, model = null, db = null;

        const ui = {
            modelBadge: document.getElementById('model-badge'),
            modelStatus: document.getElementById('model-status'),
            cacheCount: document.getElementById('cache-count'),
            btnSyncBlogger: document.getElementById('btn-sync-blogger'),
            syncSpinner: document.getElementById('sync-spinner'),
            btnClearCache: document.getElementById('btn-clear-cache'),
            btnExportZip: document.getElementById('btn-export-full-zip'),
            btnExportUpdateJson: document.getElementById('btn-export-today-json'),
            blogUrl: document.getElementById('blog-url'),
            syncLogBox: document.getElementById('sync-log-box'),
            syncLog: document.getElementById('sync-log'),
            progressBarContainer: document.getElementById('progress-bar-container'),
            progressBar: document.getElementById('progress-bar')
        };

        async function init() {
            await initDB();
            await updateCacheBadge();
            
            ui.modelStatus.textContent = "Đang nạp AI Model...";
            try {
                processor = await AutoProcessor.from_pretrained(MODEL_ID);
                model = await CLIPVisionModelWithProjection.from_pretrained(MODEL_ID);
                ui.modelBadge.className = "w-3 h-3 rounded-full bg-green-500";
                ui.modelStatus.textContent = "Mô hình AI đã sẵn sàng!";
                ui.btnSyncBlogger.disabled = false;
                ui.btnSyncBlogger.classList.replace('bg-gray-400', 'bg-blue-600');
            } catch (err) {
                ui.modelBadge.className = "w-3 h-3 rounded-full bg-red-500";
                ui.modelStatus.textContent = "Lỗi khởi tạo AI: " + err.message;
            }
            setupEventListeners();
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('BloggerImageSearchV2', 1);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('posts')) {
                        database.createObjectStore('posts', { keyPath: 'postId' });
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function dbSavePost(post) {
            return new Promise((resolve) => {
                const tx = db.transaction('posts', 'readwrite');
                tx.objectStore('posts').put(post);
                tx.oncomplete = resolve;
            });
        }

        function dbGetAllPosts() {
            return new Promise((resolve) => {
                const tx = db.transaction('posts', 'readonly');
                const req = tx.objectStore('posts').getAll();
                req.onsuccess = () => resolve(req.result || []);
            });
        }

        async function updateCacheBadge() {
            const posts = await dbGetAllPosts();
            let totalImg = 0;
            posts.forEach(p => totalImg += (p.embeddings || []).length);
            ui.cacheCount.textContent = `Data: ${posts.length} bài (${totalImg} ảnh)`;
        }

        function appendLog(msg) {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            ui.syncLog.appendChild(div);
            ui.syncLogBox.scrollTop = ui.syncLogBox.scrollHeight;
        }

        function normalizeUrl(url) {
            if (!url) return '';
            return url.replace(/^http:/i, 'https:').replace(/\/(s\d+(-[c|p|k|r|w]+)?|w\d+-h\d+(-[a-z]+)?)\//i, '/s800/');
        }

        async function syncBlogger() {
            let urlStr = ui.blogUrl.value.trim();
            if (!urlStr) return alert("Vui lòng nhập URL!");
            if (!urlStr.startsWith('http')) urlStr = 'https://' + urlStr;
            if (urlStr.endsWith('/')) urlStr = urlStr.slice(0, -1);

            ui.btnSyncBlogger.disabled = true;
            ui.syncSpinner.classList.remove('hidden');
            ui.progressBarContainer.classList.remove('hidden');
            appendLog("🔄 Bắt đầu quét dữ liệu Blogger...");

            const todayStr = new Date().toISOString().split('T')[0];

            try {
                let allEntries = [], startIndex = 1, pageSize = 150;
                while (true) {
                    const data = await new Promise((res, rej) => {
                        const cb = 'cb_' + Date.now();
                        window[cb] = (d) => { delete window[cb]; script.remove(); res(d); };
                        const script = document.createElement('script');
                        script.src = `${urlStr}/feeds/posts/default?alt=json-in-script&max-results=${pageSize}&start-index=${startIndex}&callback=${cb}`;
                        script.onerror = rej;
                        document.head.appendChild(script);
                    });
                    const entries = data.feed.entry || [];
                    if (!entries.length) break;
                    allEntries = allEntries.concat(entries);
                    if (entries.length < pageSize) break;
                    startIndex += pageSize;
                }

                const parser = new DOMParser();
                const postsToProcess = [];
                allEntries.forEach(entry => {
                    const postId = entry.id.$t;
                    const title = entry.title.$t;
                    const link = entry.link.find(l => l.rel === 'alternate')?.href || urlStr;
                    const html = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : "");
                    const doc = parser.parseFromString(html, 'text/html');
                    const imgNodes = Array.from(doc.querySelectorAll('img[stat="search"], img[stat="searchp"]'));
                    const images = imgNodes.map(img => ({ url: img.src, stat: img.getAttribute('stat') || 'search' })).filter(i => i.url);
                    if (images.length) postsToProcess.push({ postId, title, link, images, embeddings: [] });
                });

                const existingPosts = await dbGetAllPosts();
                const existingMap = new Map(existingPosts.map(p => [p.postId, p]));
                let totalImgs = postsToProcess.reduce((sum, p) => sum + p.images.length, 0), processedCount = 0;

                for (let post of postsToProcess) {
                    const cachedPost = existingMap.get(post.postId);
                    const updatedEmbeddings = [];
                    let hasNewData = false;

                    for (let imgObj of post.images) {
                        const cleanUrl = normalizeUrl(imgObj.url);
                        const cached = cachedPost?.embeddings?.find(e => e.url === cleanUrl || e.rawUrl === imgObj.url);

                        if (cached) {
                            cached.stat = imgObj.stat;
                            updatedEmbeddings.push(cached);
                        } else {
                            hasNewData = true;
                            try {
                                const res = await fetch(`https://images.weserv.nl/?url=${encodeURIComponent(cleanUrl)}&output=jpg&q=80`);
                                const blob = await res.blob();
                                const rawImage = await RawImage.fromURL(URL.createObjectURL(blob));
                                const inputs = await processor(rawImage);
                                const { image_embeds } = await model(inputs);
                                
                                updatedEmbeddings.push({
                                    url: cleanUrl,
                                    rawUrl: imgObj.url,
                                    stat: imgObj.stat,
                                    vector: Array.from(image_embeds.data),
                                    updatedAt: todayStr
                                });
                            } catch (e) { appendLog(`❌ Lỗi tải ảnh: ${cleanUrl}`); }
                        }
                        processedCount++;
                        ui.progressBar.style.width = `${Math.round((processedCount/totalImgs)*100)}%`;
                    }

                    post.embeddings = updatedEmbeddings;
                    post.lastSyncedAt = hasNewData ? todayStr : (cachedPost?.lastSyncedAt || todayStr);
                    await dbSavePost(post);
                }

                appendLog("✅ Quét dữ liệu Blogger hoàn tất!");
                await updateCacheBadge();
            } catch (err) { appendLog("❌ Lỗi quét Blogger: " + err.message); }
            finally {
                ui.btnSyncBlogger.disabled = false;
                ui.syncSpinner.classList.add('hidden');
            }
        }

        // --- XUẤT ALL CACHE TO ZIP ---
        async function exportFullZip() {
            const posts = await dbGetAllPosts();
            if (!posts.length) return alert("Dữ liệu trống!");
            appendLog("⏳ Đang nén toàn bộ Cache thành file ZIP...");
            
            const zip = new JSZip();
            zip.file("cache.json", JSON.stringify(posts));
            const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
            
            downloadFile(blob, "cache.zip");
            appendLog(`✅ Đã xuất cache.zip (${(blob.size/1024/1024).toFixed(2)} MB)`);
        }

        // --- XUẤT UPDATE HÔM NAY TO JSON ---
        async function exportTodayUpdateJson() {
            const posts = await dbGetAllPosts();
            const todayStr = new Date().toISOString().split('T')[0];
            
            // Lọc ra các bài viết có ảnh bổ sung mới trong ngày hôm nay
            const updatedPosts = posts.map(post => {
                const todayEmbeds = (post.embeddings || []).filter(e => e.updatedAt === todayStr);
                if (todayEmbeds.length > 0) {
                    return { ...post, embeddings: todayEmbeds };
                }
                return null;
            }).filter(Boolean);

            if (!updatedPosts.length) {
                return alert("Hôm nay chưa có dữ liệu mới nào được bổ sung!");
            }

            const jsonStr = JSON.stringify(updatedPosts, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            
            downloadFile(blob, "update.json");
                appendLog(`✅ Đã xuất update.json (${updatedPosts.length} bài viết mới trong ngày)`);
        }

        function downloadFile(blob, filename) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function setupEventListeners() {
            ui.btnSyncBlogger.addEventListener('click', syncBlogger);
            ui.btnExportZip.addEventListener('click', exportFullZip);
            ui.btnExportUpdateJson.addEventListener('click', exportTodayUpdateJson);
            ui.btnClearCache.addEventListener('click', async () => {
                if (confirm("Xóa toàn bộ Cache?")) {
                    const tx = db.transaction('posts', 'readwrite');
                    await tx.objectStore('posts').clear();
                    await updateCacheBadge();
                    appendLog("🗑️ Đã xóa sạch dữ liệu Cache.");
                }
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
