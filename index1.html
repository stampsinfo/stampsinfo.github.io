<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Tìm kiếm Stamp UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Header & Action Controls -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800/80 p-4 rounded-xl border border-slate-700 shadow-lg">
            <div>
                <h1 class="text-xl font-bold text-teal-400">Stamp Image Matcher & Sync</h1>
                <p class="text-xs text-slate-400">Tự động đồng bộ và tra cứu tem thư thông minh</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <button id="btn-export-today" class="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 shadow">
                    📄 Xuất Update Hôm Nay (.json)
                </button>
                <button id="btn-export-zip" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 shadow">
                    📦 Xuất Dữ Liệu (.zip)
                </button>
                <button id="btn-sync-blogger" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 shadow">
                    🔄 Quét Blogger
                </button>
            </div>
        </header>

        <!-- Dynamic Log Console -->
        <div id="sync-log-box" class="hidden bg-slate-950/80 border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-300 shadow-inner">
            <div class="flex justify-between items-center pb-2 mb-2 border-b border-slate-800">
                <span class="text-teal-400 font-semibold">Terminal Nhật Ký Đồng Bộ</span>
                <span id="log-status" class="text-slate-500">Đang hoạt động...</span>
            </div>
            <div id="log-content" class="space-y-1 max-h-48 overflow-y-auto pr-2"></div>
        </div>

        <!-- Main Content Area / Interface Placeholder -->
        <main class="bg-slate-800/50 border border-slate-700 rounded-xl p-6 min-h-[300px] flex flex-col items-center justify-center text-center">
            <p class="text-slate-400 text-sm">Sử dụng thanh công cụ phía trên để xuất dữ liệu hoặc kích hoạt đồng bộ dữ liệu tự động với máy chủ.</p>
        </main>
    </div>

    <script type="module">
        // Global UI Reference Objects
        const ui = {
            syncLogBox: document.getElementById('sync-log-box'),
            logContent: document.getElementById('log-content'),
            logStatus: document.getElementById('log-status')
        };

        // --- MOCK / INDEXEDDB API STUBS ---
        // Thay thế bằng hàm IndexedDB/DB Helper thực tế trong ứng dụng của bạn
        async function dbGetAllPosts() {
            const raw = localStorage.getItem('app_posts');
            return raw ? JSON.parse(raw) : [];
        }

        async function dbSavePost(post) {
            const posts = await dbGetAllPosts();
            const index = posts.findIndex(p => p.id === post.id || p.url === post.url);
            if (index >= 0) {
                posts[index] = post;
            } else {
                posts.push(post);
            }
            localStorage.setItem('app_posts', JSON.stringify(posts));
        }

        function appendLog(message) {
            if (ui.syncLogBox.classList.contains('hidden')) {
                ui.syncLogBox.classList.remove('hidden');
            }
            const timeStr = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = 'leading-relaxed border-b border-slate-900/50 py-0.5';
            logItem.innerHTML = `<span class="text-slate-500">[${timeStr}]</span> ${message}`;
            ui.logContent.appendChild(logItem);
            ui.logContent.scrollTop = ui.logContent.scrollHeight;
        }

        async function checkAndToggleWarning() {
            // Logic cảnh báo / kiểm tra trạng thái hiển thị UI nếu cần
        }

        async function syncFromRepoCacheZip() {
            appendLog("📦 Đang tải file cache.zip từ máy chủ...");
            try {
                const res = await fetch('./cache.zip?t=' + Date.now());
                if (!res.ok) throw new Error("Không thể tải cache.zip từ máy chủ.");
                appendLog("✅ Tải cache.zip thành công! Đang giải nén và lưu trữ...");
                // Thêm logic giải nén với JSZip tại đây nếu cần
            } catch (err) {
                appendLog(`❌ Lỗi tải cache.zip: ${err.message}`);
            }
        }

        // --- CORE FEATURES IMPLEMENTATION ---

        // 1. TẠO VÀ XUẤT FILE UPDATE.JSON DÀNH CHO BÀI VIẾT TRONG NGÀY HÔM NAY
        async function exportTodayUpdateJson() {
            try {
                const posts = await dbGetAllPosts();
                if (!posts || posts.length === 0) return alert("Không có dữ liệu bài viết!");

                const todayStr = new Date().toISOString().split('T')[0];
                
                // Lọc các bài viết được cập nhật/quét trong ngày hôm nay
                const todayPosts = posts.filter(post => {
                    if (!post.updatedAt) return false;
                    return post.updatedAt.startsWith(todayStr);
                });

                if (todayPosts.length === 0) {
                    alert("Không có bài viết mới nào được cập nhật trong ngày hôm nay!");
                    return;
                }

                const jsonString = JSON.stringify(todayPosts, null, 2);
                const blob = new Blob([jsonString], { type: "application/json" });
                const downloadUrl = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `update_${todayStr}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);

                appendLog(`✅ Đã xuất update.json chứa ${todayPosts.length} bài viết trong ngày!`);
            } catch (err) {
                appendLog(`❌ Lỗi xuất update.json: ${err.message}`);
            }
        }

        // 2. SO SÁNH LOG.TXT VÀ TỰ ĐỘNG CẬP NHẬT UPDATE.JSON HOẶC CACHE.ZIP
        async function checkAndUpdateFromLog() {
            try {
                ui.syncLogBox.classList.remove('hidden');
                appendLog("🔍 Đang đọc file log.txt từ máy chủ...");

                // Tải file log.txt từ server[cite: 3]
                const logRes = await fetch('./log.txt?t=' + Date.now());
                if (!logRes.ok) {
                    appendLog("⚠️ Không tìm thấy file log.txt!");
                    return;
                }
                
                const logText = await logRes.text();
                let serverPosts = 0;
                let serverImages = 0;

                // Bóc tách dữ liệu posts=X và images=Y từ log.txt[cite: 3]
                logText.split('\n').forEach(line => {
                    const [key, val] = line.trim().split('=');
                    if (key === 'posts') serverPosts = parseInt(val, 10) || 0;
                    if (key === 'images') serverImages = parseInt(val, 10) || 0;
                });

                // Đếm số lượng bài viết và ảnh hiện tại trong DB/Cache của máy
                const localPosts = await dbGetAllPosts();
                let localImages = 0;
                localPosts.forEach(p => localImages += (p.embeddings || []).length);

                appendLog(`📊 Máy hiện tại: ${localPosts.length} bài (${localImages} ảnh) | Máy chủ (log.txt): ${serverPosts} bài (${serverImages} ảnh)`);

                // TRƯỜNG HỢP 1: Máy chưa có cache -> Tải toàn bộ cache.zip[cite: 3]
                if (localPosts.length === 0) {
                    appendLog("📦 Máy chưa có dữ liệu Cache. Tiến hành tải cache.zip...");
                    await syncFromRepoCacheZip();
                    return;
                }

                // TRƯỜNG HỢP 2: Dữ liệu máy ít hơn log.txt -> Tải update.json để cập nhật[cite: 3]
                if (localPosts.length < serverPosts || localImages < serverImages) {
                    appendLog("📥 Phát hiện bài viết/ảnh mới trên máy chủ! Đang tải update.json...");
                    
                    const updateRes = await fetch('./update.json?t=' + Date.now());
                    if (!updateRes.ok) {
                        appendLog("⚠️ Không tìm thấy update.json trên máy chủ. Tải lại toàn bộ cache.zip...");
                        await syncFromRepoCacheZip();
                        return;
                    }

                    const updatePosts = await updateRes.json();
                    if (Array.isArray(updatePosts)) {
                        let updatedCount = 0;
                        for (const post of updatePosts) {
                            await dbSavePost(post);
                            updatedCount++;
                        }
                        appendLog(`🎉 Cập nhật thành công ${updatedCount} bài viết mới từ update.json!`);
                        await checkAndToggleWarning();
                    }
                } else {
                    appendLog("✨ Dữ liệu Cache tại máy đã đồng bộ hoàn toàn với log.txt.");
                }

            } catch (err) {
                appendLog(`❌ Lỗi khi kiểm tra log.txt: ${err.message}`);
            }
        }

        // HÀM MÔ PHỎNG QUÉT BLOGGER CÓ BỔ SUNG UPDATEDAT[cite: 2]
        async function mockSyncBlogger() {
            appendLog("🔄 Đang quét bài viết mới từ Blogger...");
            
            // Giả lập 1 bài viết được cập nhật
            const mockPost = {
                id: "post_" + Date.now(),
                title: "Bài viết tem thư mới",
                url: "https://stamp.io.vn/post-example",
                embeddings: ["hash_value_1", "hash_value_2"],
                updatedAt: new Date().toISOString() // Bổ sung mốc thời gian cập nhật[cite: 2]
            };

            await dbSavePost(mockPost);
            appendLog(`✅ Đã quét thành công 1 bài viết mới! (Gán updatedAt: ${mockPost.updatedAt})`);
        }

        // --- EVENT LISTENERS & INITIALIZATION ---
        function setupEventListeners() {
            // Nút xuất update.json hôm nay[cite: 2]
            document.getElementById('btn-export-today').addEventListener('click', exportTodayUpdateJson);
            
            // Nút mô phỏng quét Blogger
            document.getElementById('btn-sync-blogger').addEventListener('click', mockSyncBlogger);
        }

        // Hàm khởi tạo chính của ứng dụng
        async function init() {
            setupEventListeners();
            
            // Thay thế việc gọi trực tiếp syncFromRepoCacheZip bằng hàm kiểm tra tự động[cite: 2]
            await checkAndUpdateFromLog();
        }

        // Chạy khởi tạo ứng dụng khi DOM sẵn sàng
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
