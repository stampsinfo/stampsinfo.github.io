<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm kiếm tem thư theo hình ảnh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        #cropper-container-box { width: 100%; height: 50vh; max-height: 400px; position: relative; overflow: hidden; }
        #cropper-image { display: block; max-width: 100%; opacity: 0; transition: opacity 0.15s ease-in; }
        #cropper-image.loaded { opacity: 1; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen">
    <!-- MODAL CẮT ẢNH -->
    <div id="cropper-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-screen">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-800">Cắt ảnh chọn con tem</h3>
                <button id="btn-close-cropper" class="text-gray-500 hover:text-red-500 font-bold text-2xl">&times;</button>
            </div>
            <div id="cropper-container-box" class="p-4 bg-gray-900 flex items-center justify-center">
                <img id="cropper-image" src="" alt="Cắt ảnh">
            </div>
            <div class="p-4 border-t flex justify-end gap-3 bg-gray-50">
                <button id="btn-cancel-crop" class="px-5 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold">Hủy</button>
                <button id="btn-confirm-crop" class="px-5 py-2 bg-blue-600 text-white rounded-lg font-semibold flex items-center gap-2">✂️ Tìm kiếm</button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-extrabold text-gray-900">Tìm kiếm tem thư AI</h1>
            <p class="text-sm text-gray-600 mt-1">Tra cứu Vector hình ảnh clip-vit-base-patch32</p>
        </header>

        <!-- Trạng thái Hệ thống -->
        <div class="bg-white p-4 rounded-xl shadow-sm border mb-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span id="model-badge" class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span id="model-status" class="text-sm font-medium">Đang kiểm tra Cache & Khởi tạo AI...</span>
                </div>
                <span id="cache-count" class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full font-semibold">Cache: 0 bài</span>
            </div>
            <div id="sync-log" class="text-xs text-blue-600 mt-2 font-mono"></div>
        </div>

        <!-- BƯỚC TẢI ẢNH -->
        <div class="bg-white p-5 rounded-xl shadow-sm border mb-6">
            <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 hover:bg-blue-50/50 min-h-[140px]">
                <svg class="w-9 h-9 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <span class="text-sm font-medium text-gray-700">Kéo thả ảnh hoặc chọn tải lên</span>
                <input type="file" id="file-input" class="hidden" accept="image/*">
            </div>

            <!-- Cấu hình mật khẩu & Độ tương đồng -->
            <div class="mt-4 pt-4 border-t space-y-3">
                <div class="flex items-center gap-4">
                    <label class="text-xs sm:text-sm font-medium text-gray-700">Độ tương đồng:</label>
                    <input type="range" id="threshold-slider" min="0.55" max="0.95" step="0.01" value="0.60" class="flex-1 accent-blue-600">
                    <span id="threshold-value" class="text-sm font-bold text-blue-600">60%</span>
                </div>
                <div class="relative flex items-center">
                    <input type="password" id="search-password" placeholder="Mật khẩu xem ảnh ẩn (Nâng cao)..." class="w-full border rounded-lg pl-4 pr-10 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <span id="password-status-dot" class="absolute right-3.5 w-3 h-3 rounded-full bg-yellow-500"></span>
                </div>
            </div>
        </div>

        <!-- BƯỚC KẾT QUẢ -->
        <div id="results-section" class="hidden bg-white p-5 rounded-xl shadow-sm border">
            <div class="flex items-center gap-4 mb-6">
                <img id="query-preview" class="w-24 h-24 object-cover rounded-lg border" src="" alt="Preview">
                <div>
                    <div id="search-status" class="text-sm font-semibold text-blue-600">Đang phân tích...</div>
                </div>
            </div>
            <h3 class="text-md font-bold mb-3 pb-2 border-b flex justify-between">
                <span>Kết quả tìm kiếm</span>
                <span id="match-count-badge" class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">0</span>
            </h3>
            <div id="results-list" class="space-y-3"></div>
        </div>
    </div>

    <script type="module">
        import { AutoProcessor, CLIPVisionModelWithProjection, RawImage, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js';

        env.allowLocalModels = false;
        const MODEL_ID = 'Xenova/clip-vit-base-patch32';
        const CORRECT_PASSWORD = "123456";
        let processor = null, model = null, db = null, cropperInstance = null;

        const ui = {
            modelBadge: document.getElementById('model-badge'),
            modelStatus: document.getElementById('model-status'),
            cacheCount: document.getElementById('cache-count'),
            syncLog: document.getElementById('sync-log'),
            dropZone: document.getElementById('drop-zone'),
            fileInput: document.getElementById('file-input'),
            thresholdSlider: document.getElementById('threshold-slider'),
            thresholdValue: document.getElementById('threshold-value'),
            searchPassword: document.getElementById('search-password'),
            passwordStatusDot: document.getElementById('password-status-dot'),
            resultsSection: document.getElementById('results-section'),
            queryPreview: document.getElementById('query-preview'),
            searchStatus: document.getElementById('search-status'),
            resultsList: document.getElementById('results-list'),
            matchCountBadge: document.getElementById('match-count-badge'),
            cropperModal: document.getElementById('cropper-modal'),
            cropperImage: document.getElementById('cropper-image'),
            btnCancelCrop: document.getElementById('btn-cancel-crop'),
            btnConfirmCrop: document.getElementById('btn-confirm-crop'),
            btnCloseCropper: document.getElementById('btn-close-cropper')
        };

        async function init() {
            await initDB();
            
            // 🔍 THỰC HIỆN KIỂM TRA ĐỒNG BỘ CACHE TỰ ĐỘNG THEO YÊU CẦU
            await autoSyncSmartCache();

            try {
                processor = await AutoProcessor.from_pretrained(MODEL_ID);
                model = await CLIPVisionModelWithProjection.from_pretrained(MODEL_ID);
                ui.modelBadge.className = "w-3 h-3 rounded-full bg-green-500";
                ui.modelStatus.textContent = "AI sẵn sàng!";
            } catch (err) {
                ui.modelBadge.className = "w-3 h-3 rounded-full bg-red-500";
                ui.modelStatus.textContent = "Lỗi nạp AI: " + err.message;
            }

            setupEventListeners();
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('BloggerImageSearchV2', 1);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('posts')) {
                        database.createObjectStore('posts', { keyPath: 'postId' });
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function dbGetAllPosts() {
            return new Promise((resolve) => {
                const tx = db.transaction('posts', 'readonly');
                const req = tx.objectStore('posts').getAll();
                req.onsuccess = () => resolve(req.result || []);
            });
        }

        function dbSavePost(post) {
            return new Promise((resolve) => {
                const tx = db.transaction('posts', 'readwrite');
                tx.objectStore('posts').put(post);
                tx.oncomplete = resolve;
            });
        }

        async function updateCacheBadge() {
            const posts = await dbGetAllPosts();
            let totalImg = 0;
            posts.forEach(p => totalImg += (p.embeddings || []).length);
            ui.cacheCount.textContent = `Data: ${posts.length} bài (${totalImg} ảnh)`;
        }

        // 🧠 THUẬT TOÁN ĐỒNG BỘ THÔNG MINH
        async function autoSyncSmartCache() {
            const localPosts = await dbGetAllPosts();

            if (localPosts.length === 0) {
                // TRƯỜNG HỢP 1: CHƯA CÓ CACHE TRÊN MÁY -> TẢI FILE cache.zip
                ui.syncLog.textContent = "📦 Máy chưa có Cache. Đang tải gói full (cache.zip)...";
                try {
                    const res = await fetch('./cache.zip?t=' + Date.now());
                    if (!res.ok) throw new Error("Không tìm thấy cache.zip trên server!");
                    const blob = await res.blob();
                    const jszip = new JSZip();
                    const zip = await jszip.loadAsync(blob);
                    const jsonFile = zip.file("cache.json");
                    if (jsonFile) {
                        const repoPosts = JSON.parse(await jsonFile.async("string"));
                        for (let p of repoPosts) await dbSavePost(p);
                        ui.syncLog.textContent = `✅ Đã tải và khởi tạo thành công ${repoPosts.length} bài từ cache.zip!`;
                    }
                } catch (e) {
                    ui.syncLog.textContent = "⚠️ Không thể tự động tải full cache.zip: " + e.message;
                }
            } else {
                // TRƯỜNG HỢP 2: ĐÃ CÓ CACHE TRÊN MÁY -> TẢI FILE update.json ĐỂ BỔ SUNG & KIỂM TRA
                ui.syncLog.textContent = "🔄 Máy đã có Cache. Đang kiểm tra dữ liệu bổ sung (update.json)...";
                try {
                    const res = await fetch('./update.json?t=' + Date.now());
                    if (!res.ok) {
                        ui.syncLog.textContent = "✨ Dữ liệu hiện tại trên máy đã mới nhất.";
                        await updateCacheBadge();
                        return;
                    }
                    const updatePosts = await res.json();
                    if (Array.isArray(updatePosts) && updatePosts.length > 0) {
                        const localMap = new Map(localPosts.map(p => [p.postId, p]));
                        let addedCount = 0;

                        for (let upPost of updatePosts) {
                            const localPost = localMap.get(upPost.postId);
                            if (!localPost) {
                                await dbSavePost(upPost);
                                addedCount++;
                            } else {
                                // Kiểm tra và bổ sung các Vector ảnh chưa tồn tại
                                const existingUrls = new Set((localPost.embeddings || []).map(e => e.url));
                                let hasNew = false;
                                for (let newEmb of (upPost.embeddings || [])) {
                                    if (!existingUrls.has(newEmb.url)) {
                                        localPost.embeddings.push(newEmb);
                                        hasNew = true;
                                    }
                                }
                                if (hasNew) {
                                    await dbSavePost(localPost);
                                    addedCount++;
                                }
                            }
                        }
                        ui.syncLog.textContent = addedCount > 0 ? `🎉 Đã bổ sung thành công ${addedCount} bài viết mới từ update.json!` : "✨ Dữ liệu đã đầy đủ và trùng khớp.";
                    }
                } catch (e) {
                    ui.syncLog.textContent = "✨ Không có bản cập nhật mới (update.json).";
                }
            }
            await updateCacheBadge();
        }

        // --- XỬ LÝ PHÂN TÍCH VÀ TÌM KIẾM ---
        async function processAndSearch(fileOrBlob) {
            if (!processor || !model) return alert("Mô hình AI chưa chuẩn bị xong!");
            ui.resultsSection.classList.remove('hidden');
            ui.searchStatus.textContent = "Đang sinh Embedding AI Vector...";
            ui.resultsList.innerHTML = "";

            ui.queryPreview.src = URL.createObjectURL(fileOrBlob);
            try {
                const rawImage = await RawImage.fromURL(URL.createObjectURL(fileOrBlob));
                const inputs = await processor(rawImage);
                const { image_embeds } = await model(inputs);
                await runVectorSearch(image_embeds.data);
            } catch (err) { ui.searchStatus.textContent = "❌ Lỗi: " + err.message; }
        }

        async function runVectorSearch(queryVector) {
            const posts = await dbGetAllPosts();
            const minThreshold = parseFloat(ui.thresholdSlider.value);
            const isUnlocked = (ui.searchPassword.value.trim() === CORRECT_PASSWORD);
            const matches = [];

            for (const post of posts) {
                let maxScore = -1, bestImg = "";
                for (const imgItem of (post.embeddings || [])) {
                    if (!isUnlocked && imgItem.stat === 'searchp') continue;
                    const score = cosineSimilarity(queryVector, imgItem.vector);
                    if (score > maxScore) {
                        maxScore = score;
                        bestImg = imgItem.url;
                    }
                }
                if (maxScore >= minThreshold) {
                    matches.push({ title: post.title, link: post.link, score: maxScore, thumb: bestImg });
                }
            }

            matches.sort((a, b) => b.score - a.score);
            renderResults(matches.slice(0, 10));
        }

        function cosineSimilarity(vecA, vecB) {
            let dot = 0, normA = 0, normB = 0;
            for (let i = 0; i < vecA.length; i++) {
                dot += vecA[i] * vecB[i];
                normA += vecA[i] * vecA[i];
                normB += vecB[i] * vecB[i];
            }
            return (normA === 0 || normB === 0) ? 0 : dot / (Math.sqrt(normA) * Math.sqrt(normB));
        }

        function renderResults(matches) {
            ui.searchStatus.textContent = "Tìm kiếm xong!";
            ui.matchCountBadge.textContent = matches.length;
            ui.resultsList.innerHTML = matches.length ? "" : `<div class="text-gray-500 italic text-sm">Không tìm thấy kết quả phù hợp.</div>`;

            matches.forEach(item => {
                const pct = Math.round(item.score * 100);
                const el = document.createElement('div');
                el.className = "flex items-center gap-4 p-3 bg-gray-50 border rounded-lg";
                el.innerHTML = `
                    <img src="${item.thumb}" class="w-16 h-16 object-cover rounded border">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-bold truncate">${item.title}</h4>
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-700 mt-1 inline-block">${pct}%</span>
                    </div>
                    <a href="${item.link}" target="_blank" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-semibold">Xem bài</a>
                `;
                ui.resultsList.appendChild(el);
            });
        }

        // --- SỰ KIỆN CẮT ẢNH ---
        function openCropperModal(file) {
            if (cropperInstance) cropperInstance.destroy();
            ui.cropperModal.classList.remove('hidden');
            ui.cropperModal.classList.add('flex');
            const url = URL.createObjectURL(file);
            ui.cropperImage.src = url;
            cropperInstance = new Cropper(ui.cropperImage, { viewMode: 1, autoCropArea: 0.85 });
        }

        function closeCropperModal() {
            ui.cropperModal.classList.add('hidden');
            if (cropperInstance) cropperInstance.destroy();
        }

        function setupEventListeners() {
            ui.dropZone.addEventListener('click', () => ui.fileInput.click());
            ui.fileInput.addEventListener('change', (e) => e.target.files[0] && openCropperModal(e.target.files[0]));
            ui.btnCancelCrop.addEventListener('click', closeCropperModal);
            ui.btnCloseCropper.addEventListener('click', closeCropperModal);
            ui.btnConfirmCrop.addEventListener('click', () => {
                if (!cropperInstance) return;
                cropperInstance.getCroppedCanvas({ maxWidth: 1024, maxHeight: 1024 }).toBlob((blob) => {
                    closeCropperModal();
                    processAndSearch(blob);
                }, 'image/jpeg', 0.9);
            });
            ui.thresholdSlider.addEventListener('input', (e) => {
                ui.thresholdValue.textContent = Math.round(e.target.value * 100) + '%';
            });
            ui.searchPassword.addEventListener('input', () => {
                const isCorrect = ui.searchPassword.value.trim() === CORRECT_PASSWORD;
                ui.passwordStatusDot.className = `absolute right-3.5 w-3 h-3 rounded-full ${isCorrect ? 'bg-green-500' : 'bg-red-500'}`;
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
